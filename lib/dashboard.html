<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.ai — дашборд</title>
<style>
:root {
  --bg: #fff; --fg: #1a1a1a; --muted: #6b7280;
  --border: #e5e7eb; --accent: #2563eb; --accent-bg: #eff6ff;
  --red: #dc2626; --green: #16a34a; --yellow: #ca8a04;
  --row-hover: #f9fafb; --card: #fff; --input-bg: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af;
    --border: #374151; --accent: #60a5fa; --accent-bg: #1e3a5f;
    --red: #f87171; --green: #4ade80; --yellow: #facc15;
    --row-hover: #1f2937; --card: #1f2937; --input-bg: #374151;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
header h1 { font-size: 16px; font-weight: 600; }
nav { display: flex; gap: 4px; }
nav button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; font-size: 13px; }
nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
main { padding: 16px 20px; max-width: 1400px; }
.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filters select, .filters input { padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--input-bg); color: var(--fg); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--accent); }
th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--bg); }
tr:hover td { background: var(--row-hover); }
tr { cursor: pointer; }
.status { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.status.completed { background: #dcfce7; color: #166534; }
.status.failed { background: #fef2f2; color: #991b1b; }
.status.running { background: #dbeafe; color: #1e40af; }
.status.killed { background: #fef3c7; color: #92400e; }
.status.pending { background: #f3f4f6; color: #6b7280; }
@media (prefers-color-scheme: dark) {
  .status.completed { background: #14532d; color: #86efac; }
  .status.failed { background: #7f1d1d; color: #fca5a5; }
  .status.running { background: #1e3a5f; color: #93c5fd; }
  .status.killed { background: #713f12; color: #fde68a; }
  .status.pending { background: #374151; color: #d1d5db; }
}
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card h3 { font-size: 14px; margin-bottom: 8px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center; }
.stat .val { font-size: 28px; font-weight: 700; }
.stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chart { display: flex; align-items: flex-end; gap: 2px; height: 80px; margin: 8px 0; }
.chart div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; }
.detail-panel { position: fixed; top: 0; right: 0; width: 55%; height: 100vh; background: var(--bg); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; z-index: 10; box-shadow: -4px 0 12px rgba(0,0,0,.08); display: none; }
.detail-panel.open { display: block; }
.detail-panel .close { position: sticky; top: 8px; float: right; background: var(--border); border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 14px; color: var(--fg); }
.detail-panel pre { background: var(--row-hover); padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.detail-panel .field { margin-bottom: 6px; }
.detail-panel .field .k { color: var(--muted); font-size: 11px; }
.detail-panel .field .v { font-size: 13px; }
label { font-size: 12px; color: var(--muted); display: block; margin-top: 8px; }
input[type=text], select { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--input-bg); color: var(--fg); font-size: 13px; margin-top: 2px; }
button.primary { padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 12px; }
button.danger { padding: 8px 20px; background: var(--red); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 12px; }
.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,.3); z-index: 9; }
.overlay.open { display: block; }
.spark { display: flex; gap: 1px; margin: 8px 0; }
.spark span { width: 6px; background: var(--accent); border-radius: 0 0 2px 2px; }
/* animations */
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.pulse { animation: pulse 1.5s ease-in-out infinite; }
.agent-card { transition: transform .15s, box-shadow .15s; }
.agent-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
/* toast */
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 10px 16px; border-radius: 6px; font-size: 13px; color: #fff; animation: fadeIn .2s; max-width: 360px; }
.toast.ok { background: var(--green); }
.toast.err { background: var(--red); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
/* tooltip */
.tip { position: relative; border-bottom: 1px dotted var(--muted); cursor: help; }
.tip .tt { display: none; position: absolute; bottom: calc(100% + 6px); left: 0; background: var(--fg); color: var(--bg); font-size: 11px; line-height: 1.4; padding: 6px 10px; border-radius: 5px; white-space: normal; width: 260px; z-index: 99; pointer-events: none; }
.tip:hover .tt { display: block; }
.tip .tt::after { content: ''; position: absolute; top: 100%; left: 12px; border: 5px solid transparent; border-top-color: var(--fg); }
label .tip { font-weight: normal; }
/* modal */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,.4); z-index: 50; justify-content: center; align-items: center; }
.modal.open { display: flex; }
.modal .box { background: var(--card); border-radius: 10px; padding: 24px; width: 500px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal .box h3 { margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <h1>.ai дашборд</h1>
  <nav>
    <button data-tab="jobs" class="active">Задачи</button>
    <button data-tab="stats">Статистика</button>
    <button data-tab="settings">Агенты</button>
  </nav>
  <span style="flex:1"></span>
  <span id="conn" style="font-size:11px;color:var(--green)">●</span>
</header>

<main id="main"></main>
<div class="overlay" id="overlay"></div>
<div class="detail-panel" id="detail"></div>
<div class="toast-container" id="toasts"></div>
<div class="modal" id="modal">
  <div class="box" id="modal-body"></div>
</div>

<script>
const API = '';

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

async function get(url) {
  const r = await fetch(API + url);
  if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
  return r.json();
}

async function post(url, body) {
  const r = await fetch(API + url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  return r.json();
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function statusBadge(s) { return '<span class="status ' + esc(s) + '">' + esc(s) + '</span>'; }

function fmtNum(n) {
  if (n == null) return '---';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function fmtCost(j) {
  if (j.cost == null) return '---';
  if (j.cost === 0) return '$0';
  return '$' + j.cost.toFixed(4);
}

// ===================================================================== JOBS

let jobsCache = [];
let sortField = 'createdAt';
let sortDir = -1;  // -1 = по убыванию (новые сверху), 1 = по возрастанию
let eventSource = null;

async function loadJobs() {
  // If we already have an EventSource, keep it running
  if (eventSource) return;
  
  jobsCache = await get('/api/jobs');
  renderJobs();
  
  // Set up SSE for real-time updates
  eventSource = new EventSource('/api/events');
  
  eventSource.addEventListener('init', (e) => {
    const jobs = JSON.parse(e.data);
    jobsCache = jobs;
    renderJobs();
  });
  
  eventSource.addEventListener('job-update', (e) => {
    const updates = JSON.parse(e.data);
    if (Array.isArray(updates)) {
      // Handle multiple updates
      updates.forEach(update => {
        if (update.status === 'deleted') {
          // Remove deleted job
          jobsCache = jobsCache.filter(j => j.id !== update.id);
        } else {
          // Update or add job
          const index = jobsCache.findIndex(j => j.id === update.id);
          if (index >= 0) {
            jobsCache[index] = { ...jobsCache[index], ...update };
          } else {
            jobsCache.push(update);
          }
        }
      });
    } else {
      // Single update
      const update = updates;
      const index = jobsCache.findIndex(j => j.id === update.id);
      if (index >= 0) {
        jobsCache[index] = { ...jobsCache[index], ...update };
      } else {
        jobsCache.push(update);
      }
    }
    renderJobs();
  });
  
  eventSource.onerror = function(error) {
    console.error('SSE connection error:', error);
    // Try to reconnect after a delay
    setTimeout(() => {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
        // Fallback to polling if SSE fails
        if ($('nav button.active')?.dataset?.tab === 'jobs') {
          loadJobs();
        }
      }
    }, 3000);
  };
}

function renderJobs() {
  const fStatus = $('#filter-status')?.value || '';
  const fModel = $('#filter-model')?.value || '';
  const fSearch = ($('#filter-search')?.value || '').toLowerCase();

  let list = jobsCache.filter(j => {
    if (fStatus && j.status !== fStatus) return false;
    if (fModel && j.model !== fModel) return false;
    if (fSearch && !(j.id + j.task).toLowerCase().includes(fSearch)) return false;
    return true;
  });

  // сортировка
  list.sort((a, b) => {
    const va = (a[sortField] || ''), vb = (b[sortField] || '');
    return sortDir * va.localeCompare(vb);
  });

  const models = [...new Set(jobsCache.map(j => j.model))].sort();

  const sortArrow = (field) => field === sortField ? (sortDir === -1 ? ' ▼' : ' ▲') : '';

  // Build filters HTML
  let filtersHtml = '<div class="filters">';
  filtersHtml += '<select id="filter-status" onchange="renderJobs()"><option value="">все статусы</option>';
  for (const s of ['completed','failed','running','killed','pending'])
    filtersHtml += '<option value="' + s + '"' + (fStatus === s ? ' selected' : '') + '>' + s + '</option>';
  filtersHtml += '</select>';
  filtersHtml += '<select id="filter-model" onchange="renderJobs()"><option value="">все модели</option>';
  for (const m of models)
    filtersHtml += '<option value="' + m + '"' + (fModel === m ? ' selected' : '') + '>' + m + '</option>';
  filtersHtml += '</select>';
  filtersHtml += '<input id="filter-search" placeholder="поиск по задаче..." value="' + esc(fSearch) + '" oninput="renderJobs()">';
  filtersHtml += '<span style="margin-left:auto;color:var(--muted);font-size:12px">' + list.length + ' из ' + jobsCache.length + '</span>';
  filtersHtml += '</div>';

  // Create table HTML
  let tableHtml = '<table><thead><tr>';
  tableHtml += '<th>ID</th><th>Задача</th><th>Статус</th><th>Модель</th><th>variant</th><th>Проверка</th>';
  tableHtml += '<th style="cursor:pointer" onclick="sortField=\'createdAt\';sortDir=-sortDir;renderJobs()">Создана' + sortArrow('createdAt') + '</th>';
  tableHtml += '<th>Длит.</th><th>Стоимость</th><th>Токены</th>';
  tableHtml += '</tr></thead><tbody id="jobs-tbody">';

  // Create rows for each job
  for (const j of list) {
    const shortId = j.id.length > 42 ? j.id.slice(0, 39) + '...' : j.id;
    const created = j.createdAt ? j.createdAt.slice(0,16).replace('T',' ') : '---';
    tableHtml += '<tr onclick="openDetail(\'' + j.id + '\')" title="' + esc(j.id) + '\\nсоздана: ' + esc(j.createdAt || '') + '\\nзапущена: ' + esc(j.startedAt || '') + '\\nзавершена: ' + esc(j.finishedAt || '') + '">';
    tableHtml += '<td style="font-family:monospace;font-size:11px">' + esc(shortId) + '</td>';
    tableHtml += '<td>' + esc(j.task || '') + '</td>';
    tableHtml += '<td>' + statusBadge(j.status) + '</td>';
    tableHtml += '<td>' + esc(j.model) + '</td>';
    tableHtml += '<td style="color:var(--muted)">' + esc(j.variant || '---') + '</td>';
    tableHtml += '<td>' + (j.verifyStatus ? statusBadge(j.verifyStatus) : '---') + '</td>';
    tableHtml += '<td style="font-size:11px;color:var(--muted)">' + esc(created) + '</td>';
    tableHtml += '<td style="color:var(--muted)">' + esc(j.duration) + '</td>';
    tableHtml += '<td>' + fmtCost(j) + '</td>';
    tableHtml += '<td>' + (j.tokens ? fmtNum(j.tokens.total) : '---') + '</td>';
    tableHtml += '</tr>';
  }

  tableHtml += '</tbody></table>';

  // Incremental update
  const main = $('#main');
  const currentFilters = main.querySelector('.filters');
  const currentTable = main.querySelector('table');
  
  if (currentFilters) {
    // Update filters if they changed
    if (currentFilters.innerHTML !== filtersHtml) {
      currentFilters.outerHTML = filtersHtml;
    }
  } else {
    // Insert filters at the beginning
    main.insertAdjacentHTML('afterbegin', filtersHtml);
  }
  
  if (currentTable) {
    // Update table body with incremental changes
    const tbody = currentTable.querySelector('#jobs-tbody');
    if (tbody) {
      // For now, we'll do a full table replacement for simplicity
      // but preserve the table structure
      currentTable.outerHTML = tableHtml;
    } else {
      currentTable.outerHTML = tableHtml;
    }
  } else {
    // Insert table
    main.insertAdjacentHTML('beforeend', tableHtml);
  }
}

// ===================================================================== DETAIL

async function openDetail(id) {
  const d = await get('/api/jobs/' + id);
  let h = '<button class="close" onclick="closeDetail()">✕</button>';
  h += '<h3>' + esc(d.task || d.id) + '</h3>';

  const fields = [
    ['ID', d.id], ['статус', d.status + (d.exitCode != null ? ' (код ' + d.exitCode + ')' : '')],
    ['исполнитель', (d.runner || '') + (d.model ? ' / ' + d.model : '') + (d.variant ? ' (variant: ' + d.variant + ')' : '')],
    ['директория', d.cwd], ['сессия', d.sessionId],
    ['запущена', d.startedAt], ['длительность', fmtDuration(d.startedAt, d.finishedAt)],
    ['стоимость', fmtCost(d)], ['токены', d.tokens ? 'всего ' + fmtNum(d.tokens.total) + ' (вход ' + fmtNum(d.tokens.input) + ', выход ' + fmtNum(d.tokens.output) + ')' : '---'],
    ['проверка', d.verifyCmd], ['результат проверки', d.verifyStatus + (d.verifyExitCode != null ? ' (код ' + d.verifyExitCode + ')' : '')],
    ['изменения', d.changedFiles != null ? d.changedFiles + ' файлов' + (d.diffStat ? ' (' + esc(d.diffStat) + ')' : '') : '---'],
    ['авто-коммит', d.autoCommitted != null ? (d.autoCommitted ? 'да (обёртка)' : 'нет') : '---'],
    ['ошибка', d.error],
    ['диагноз', d.diagnosis ? d.diagnosis.outcome + (d.diagnosis.lastErrorMessage ? ': ' + esc(d.diagnosis.lastErrorMessage.slice(0, 120)) : '') : '---'],
  ];
  for (const [k, v] of fields) {
    if (v == null || v === '') continue;
    h += '<div class="field"><div class="k">' + esc(k) + '</div><div class="v">' + esc(String(v)) + '</div></div>';
  }

  if (d.resultMd) {
    h += '<h4 style="margin-top:16px">Результат (result.md)</h4>';
    h += '<pre>' + esc(d.resultMd.slice(0, 8000)) + (d.resultMd.length > 8000 ? '\n... (обрезано, всего ' + d.resultMd.length + ' симв.)' : '') + '</pre>';
  }
  if (d.verifyLogTail) {
    h += '<h4 style="margin-top:16px">verify.log</h4>';
    h += '<pre>' + esc(d.verifyLogTail) + '</pre>';
  }
  if (d.stderrTail) {
    h += '<h4 style="margin-top:16px">stderr (последние 100 строк)</h4>';
    h += '<pre>' + esc(d.stderrTail) + '</pre>';
  }

  $('#detail').innerHTML = h;
  $('#detail').classList.add('open');
  $('#overlay').classList.add('open');
}

function closeDetail() {
  $('#detail').classList.remove('open');
  $('#overlay').classList.remove('open');
}

function fmtDuration(from, to) {
  if (!from || !to) return '---';
  const d = new Date(to) - new Date(from);
  if (isNaN(d)) return '---';
  const s = Math.floor(d / 1000);
  if (s < 60) return s + 'с';
  if (s < 3600) return Math.floor(s / 60) + 'м ' + (s % 60) + 'с';
  return Math.floor(s / 3600) + 'ч ' + Math.floor((s % 3600) / 60) + 'м';
}

// ===================================================================== STATS

async function loadStats() {
  const s = await get('/api/stats');
  const a = s.all;

  let h = '<div class="stats-grid">';
  h += statCard('Задач', a.total);
  h += statCard('Успешно', (100 * a.completed / a.total).toFixed(0) + '%');
  h += statCard('Токенов', fmtNum(a.tokens.total));
  h += statCard('Стоимость', '$' + (a.cost || 0).toFixed(4));
  h += '</div>';

  // by capability
  h += '<div class="card"><h3>По типу задач</h3><table><thead><tr><th>Тип</th><th>Задач</th><th>Успех</th><th>Токенов</th><th>Стоимость</th></tr></thead><tbody>';
  for (const [cap, d] of Object.entries(s.byCapability || {})) {
    h += '<tr><td>' + esc(cap) + '</td><td>' + d.total + '</td><td>' + (100 * d.completed / d.total).toFixed(0) + '%</td><td>' + fmtNum(d.tokens.total) + '</td><td>' + fmtCost({cost:d.cost}) + '</td></tr>';
  }
  h += '</tbody></table></div>';

  // by model
  h += '<div class="card"><h3>По моделям</h3><table><thead><tr><th>Модель</th><th>Задач</th><th>Успех</th><th>Токенов</th><th>Стоимость</th></tr></thead><tbody>';
  for (const [m, d] of Object.entries(s.byModel || {})) {
    h += '<tr><td>' + esc(m) + '</td><td>' + d.total + '</td><td>' + (100 * d.completed / d.total).toFixed(0) + '%</td><td>' + fmtNum(d.tokens.total) + '</td><td>' + fmtCost({cost:d.cost}) + '</td></tr>';
  }
  h += '</tbody></table></div>';

  // daily sparklines
  const days = Object.entries(s.byDay || {}).sort();
  if (days.length > 1) {
    const maxT = Math.max(...days.map(([_,d]) => d.tokens.total));
    h += '<div class="card"><h3>Токены по дням</h3>';
    h += '<div class="chart">';
    for (const [day, d] of days) {
      const pct = maxT > 0 ? (d.tokens.total / maxT * 100) : 0;
      h += '<div style="height:' + Math.max(pct, 2) + '%" title="' + day + ': ' + fmtNum(d.tokens.total) + ' токенов"></div>';
    }
    h += '</div>';
    h += '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)">';
    h += '<span>' + days[0][0] + '</span><span>' + days[days.length-1][0] + '</span>';
    h += '</div></div>';
  }

  $('#main').innerHTML = h;
}

function statCard(label, value) {
  return '<div class="stat"><div class="val">' + esc(String(value)) + '</div><div class="lbl">' + esc(label) + '</div></div>';
}

// ===================================================================== SETTINGS

async function loadSettings() {
  const agents = await get('/api/agents');
  let h = '';

  // Карточки агентов
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:16px">';
  for (const a of agents) {
    const pulse = a.running > 0 ? '<span class="pulse" style="color:var(--green);font-size:11px">● ' + a.running + ' running</span>' : '<span style="color:var(--muted);font-size:11px">○ idle</span>';
    const tools = Object.entries(a.permissions).filter(([_,v]) => v === 'allow').map(([k]) => k).join(', ');
    h += '<div class="card agent-card" onclick="editAgent(\'' + esc(a.name) + '\')">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center">';
    h += '<strong>' + esc(a.name) + '</strong> <span style="font-size:11px;color:var(--muted)">' + esc(a.mode) + '</span>';
    h += '</div>';
    h += '<div style="font-size:12px;color:var(--muted);margin:4px 0">' + esc(a.model.split('/').pop()) + ' · variant: ' + esc(a.variant || '---') + ' · worktree: ' + (a.worktree ? '✓' : '✗') + '</div>';
    h += '<div style="font-size:11px;color:var(--muted)">tools: ' + esc(tools.slice(0, 50)) + (tools.length > 50 ? '...' : '') + '</div>';
    h += '<div style="margin-top:4px;display:flex;justify-content:space-between;align-items:center">' + pulse;
    h += '<span><button class="primary" style="font-size:11px;padding:2px 10px;margin:0" onclick="event.stopPropagation();testRun(\'' + esc(a.name) + '\')">▶ Run</button></span>';
    h += '</div>';
    h += '</div>';
  }
  h += '</div>';

  // Новый агент
  h += '<div class="card"><h3>Создать агента</h3>';
  h += '<input type="text" id="new-agent-name" placeholder="имя (латиница, дефисы)" style="width:200px;display:inline"> ';
  h += '<button class="primary" onclick="createAgent()" style="margin-top:0">Создать</button>';
  h += '</div>';

  // Редактор (скрыт, показывается при клике)
  h += '<div class="card" id="agent-editor" style="display:none"><h3>Редактор: <span id="ae-name"></span></h3>';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
  h += '<div><label>Модель ' + tip('Выбери из списка или введи свою. 🔄 — обновить из opencode models.') + '</label><div style="display:flex;gap:4px"><select id="ae-model" onchange="onModelSelect()" style="flex:1"></select><button onclick="refreshModels();return false" title="Обновить список из opencode" style="padding:4px 8px;background:var(--card);border:1px solid var(--border);border-radius:5px;cursor:pointer">🔄</button></div><input type="text" id="ae-model-custom" placeholder="или введи свою модель (provider/model)" style="display:none;margin-top:4px;width:100%"></div>';
  h += '<div><label>Variant ' + tip('Уровень reasoning: minimal, low, medium, high, max. Выше = умнее но дороже. medium для кода, high для ресёрча.') + '</label><select id="ae-variant">';
  for (const v of ['','minimal','low','medium','high','max']) h += '<option value="' + v + '">' + (v || 'нет') + '</option>';
  h += '</select></div>';
  h += '<div><label>Mode ' + tip('primary — в Tab-цикле opencode. subagent — только по @имени. all — везде.') + '</label><select id="ae-mode"><option>primary</option><option>subagent</option><option>all</option></select></div>';
  h += '<div><label>Temperature ' + tip('Креативность: 0.0 = строго по факту, 1.0 = максимально креативно. Код/анализ: 0-0.2, креатив: 0.5-1.0') + '</label><input type="text" id="ae-temp" placeholder="0.2"></div>';
  h += '<div><label>Worktree ' + tip('Да — агент в изолированной git-ветке (изменения не в основную ветку). Нет — прямо в репозитории. Для кода: всегда да.') + '</label><select id="ae-worktree"><option value="1">да</option><option value="0">нет</option></select></div>';
  h += '<div><label>Auto-commit ' + tip('Если агент забыл git commit — обёртка сделает сама. Только для worktree-задач.') + '</label><select id="ae-autocommit"><option value="1">да</option><option value="0">нет</option></select></div>';
  h += '<div><label>Max Steps ' + tip('Лимит итераций агента. После N шагов остановится. Простые: 5-10, сложные: 30-50. Защита от циклов.') + '</label><input type="text" id="ae-maxsteps" placeholder="20"></div>';
  h += '<div><label>Timeout (сек) ' + tip('Таймаут ожидания. По умолч. 1800 (30 мин). Быстрые задачи: 120-300, длительные: до 3600.') + '</label><input type="text" id="ae-timeout" placeholder="1800"></div>';
  h += '</div>';
  h += '<label>Description ' + tip('Одно предложение: что делает агент и когда применять. Видно в opencode agent list.') + '</label><input type="text" id="ae-desc">';
  h += '<label>Permissions ' + tip('Какие инструменты разрешены (через запятую). Остальные = deny. Доступны: bash, read, edit, glob, grep, webfetch, websearch, task, skill, lsp.') + '</label><input type="text" id="ae-perms" placeholder="bash,read,edit,glob,grep">';
  h += '<label>System Prompt ' + tip('Системный промпт — главные инструкции для агента. Чем конкретнее правила — тем лучше результат.') + '</label><textarea id="ae-prompt" rows="8" style="width:100%;font-family:monospace;font-size:12px"></textarea>';
  h += '<div style="margin-top:8px;display:flex;gap:8px">';
  h += '<button class="primary" onclick="saveAgent()">💾 Сохранить</button>';
  h += '<button onclick="exportAgent(\'' + esc((window._editingAgent || '')) + '\')" id="ae-export" style="padding:8px 16px;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:6px;cursor:pointer">📥 Export .md</button>';
  h += '<button class="danger" onclick="deleteAgent()">🗑 Удалить</button>';
  h += '<button onclick="document.getElementById(\'agent-editor\').style.display=\'none\'">Отмена</button>';
  h += '</div></div>';

  // Очистка
  h += '<div class="card"><h3>Очистка</h3>';
  h += '<p style="color:var(--muted);font-size:13px">worktree-gc --apply + clean --days 7</p>';
  h += '<button class="danger" onclick="runCleanup()">Очистить</button>';
  h += '<pre id="cleanup-output" style="margin-top:8px;display:none"></pre></div>';

  $('#main').innerHTML = h;
}

async function editAgent(name) {
  window._editingAgent = name;
  const a = await get('/api/agents/' + name);
  $('#agent-editor').style.display = 'block';
  $('#ae-name').textContent = name;
  // update export button
  const expBtn = $('#ae-export');
  if (expBtn) expBtn.setAttribute('onclick', 'exportAgent(\'' + name + '\')');
  // model: select or custom
  const sel = $('#ae-model');
  const customInput = $('#ae-model-custom');
  if (a.model && sel && ![...sel.options].some(o => o.value === a.model)) {
    // model not in list — add it
    const opt = document.createElement('option');
    opt.value = a.model; opt.textContent = a.model;
    sel.insertBefore(opt, sel.options[sel.options.length - 1]); // before 'другая'
  }
  if (sel) sel.value = a.model || (sel.options[0] ? sel.options[0].value : '');
  onModelSelect();
  $('#ae-variant').value = a.variant || '';
  $('#ae-mode').value = a.mode || 'primary';
  $('#ae-temp').value = a.temperature != null ? a.temperature : '';
  $('#ae-worktree').value = a.worktree ? '1' : '0';
  $('#ae-autocommit').value = a.autoCommit ? '1' : '0';
  $('#ae-maxsteps').value = a.maxSteps || '';
  $('#ae-timeout').value = a.timeout || '1800';
  $('#ae-desc').value = a.description || '';
  $('#ae-prompt').value = a.systemPrompt || '';
  $('#ae-perms').value = a.permissions ? Object.entries(a.permissions).filter(([_,v]) => v === 'allow').map(([k]) => k).join(',') : 'bash,read,edit,glob,grep';
  $('#agent-editor').scrollIntoView({ behavior: 'smooth' });
}

async function createAgent() {
  const name = $('#new-agent-name').value.trim();
  if (!name) return toast('Введи имя', 'err');
  const r = await post('/api/agents/' + name, {
    name, model: 'opencode/deepseek-v4-flash-free', variant: 'medium',
    mode: 'primary', worktree: false, timeout: 1800, autoCommit: false,
    permissions: { bash: 'allow', read: 'allow', edit: 'allow', glob: 'allow', grep: 'allow' },
    systemPrompt: '', description: '',
  });
  if (r.ok) { loadSettings(); toast('создан: ' + name); }
  else toast(r.error, 'err');
}

async function saveAgent() {
  const name = $('#ae-name').textContent;
  const agent = {
    name,
    model: $('#ae-model').value === '__custom__' ? ($('#ae-model-custom').value || '') : $('#ae-model').value,
    variant: $('#ae-variant').value || null,
    mode: $('#ae-mode').value,
    worktree: $('#ae-worktree').value === '1',
    autoCommit: $('#ae-autocommit').value === '1',
    temperature: $('#ae-temp').value ? parseFloat($('#ae-temp').value) : undefined,
    maxSteps: $('#ae-maxsteps').value ? parseInt($('#ae-maxsteps').value) : undefined,
    timeout: parseInt($('#ae-timeout').value) || 1800,
    description: $('#ae-desc').value,
    systemPrompt: $('#ae-prompt').value,
    permissions: {},
  };
  const perms = $('#ae-perms').value.split(',').map(s => s.trim()).filter(Boolean);
  for (const p of ['bash','read','edit','glob','grep','webfetch','websearch','task','skill','lsp']) {
    agent.permissions[p] = perms.includes(p) ? 'allow' : 'deny';
  }
  const r = await post('/api/agents/' + name, agent);
  if (r.ok) { toast('сохранено: ' + name); loadSettings(); }
  else toast(r.error, 'err');
}

async function deleteAgent() {
  const name = $('#ae-name').textContent;
  if (!confirm('Удалить агента ' + name + '?')) return;
  const r = await fetch(API + '/api/agents/' + name, { method: 'DELETE' });
  const j = await r.json();
  if (j.ok) { $('#agent-editor').style.display = 'none'; loadSettings(); toast('удалён: ' + name); }
  else toast(j.error, 'err');
}

async function runCleanup() {
  if (!confirm('Запустить очистку? Будут удалены задачи старше 7 дней и worktree-ветки без задач.')) return;
  const out = $('#cleanup-output');
  out.style.display = 'block';
  out.textContent = 'Выполняется...';
  try {
    const r = await post('/api/cleanup', {});
    out.textContent = r.ok ? r.output : ('Ошибка: ' + r.error);
  } catch(e) {
    out.textContent = 'Ошибка: ' + e.message;
  }
}

// ===================================================================== MODELS

async function refreshModels() {
  try {
    const r = await get('/api/models');
    const sel = $('#ae-model');
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = '';
    // группировка по провайдеру
    const groups = {};
    for (const m of r.models) {
      if (!groups[m.provider]) groups[m.provider] = [];
      groups[m.provider].push(m);
    }
    for (const [prov, models] of Object.entries(groups).sort()) {
      const og = document.createElement('optgroup');
      og.label = prov;
      for (const m of models) {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.label || m.id;
        og.appendChild(opt);
      }
      sel.appendChild(og);
    }
    // опция для своей модели
    const og = document.createElement('optgroup');
    og.label = '──';
    const custom = document.createElement('option');
    custom.value = '__custom__';
    custom.textContent = '▸ другая модель...';
    og.appendChild(custom);
    sel.appendChild(og);

    if (cur && cur !== '__custom__') sel.value = cur;
    toast('моделей: ' + r.models.length + ' (' + r.source + ')');
  } catch(e) { toast('ошибка загрузки моделей', 'err'); }
}

function onModelSelect() {
  const sel = $('#ae-model');
  const customInput = $('#ae-model-custom');
  if (sel && sel.value === '__custom__') {
    customInput.style.display = 'block';
    customInput.focus();
  } else {
    customInput.style.display = 'none';
  }
}

// preload models on settings page
(async function() { await refreshModels(); })();

// ===================================================================== TAB ROUTING

const routes = {
  jobs: loadJobs,
  stats: loadStats,
  settings: loadSettings,
};

function switchTab(name) {
  $$('nav button').forEach(b => b.classList.remove('active'));
  $('nav button[data-tab="' + name + '"]').classList.add('active');
  routes[name]();
}

$$('nav button').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});

$('#overlay').addEventListener('click', closeDetail);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

// ===================================================================== TOOLTIP

function tip(text) {
  return '<span class="tip">ⓘ<span class="tt">' + text + '</span></span>';
}

// ===================================================================== TOAST

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ===================================================================== MODAL

function showModal(html) {
  $('#modal-body').innerHTML = html;
  $('#modal').classList.add('open');
}
function closeModal() {
  $('#modal').classList.remove('open');
}
$('#modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ===================================================================== KEYBOARD

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeDetail(); closeModal(); }
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); const s = $('#ae-name'); if (s && s.textContent) saveAgent(); }
});

// ===================================================================== TEST RUN

async function testRun(name) {
  showModal('<h3>▶ Test Run: ' + esc(name) + '</h3>' +
    '<label>Промпт ' + tip('Короткий тестовый запрос. Например: прочитай README.md и напиши краткое резюме. Или: создай файл test.txt с текстом ok.') + '</label><textarea id="tr-prompt" rows="3" style="width:100%">echo "hello from ' + esc(name) + '"</textarea>' +
    '<label>Repo ' + tip('В каком репозитории работать. . = текущая директория. Или полный путь: /d/work/project') + '</label><input type="text" id="tr-repo" value=".">' +
    '<div style="margin-top:8px;display:flex;gap:8px">' +
    '<button class="primary" onclick="doTestRun(\'' + name + '\')">Запустить</button>' +
    '<button onclick="closeModal()">Отмена</button></div>' +
    '<pre id="tr-output" style="margin-top:8px;display:none;max-height:300px;overflow:auto;font-size:11px"></pre>');
}

async function doTestRun(name) {
  const prompt = $('#tr-prompt').value;
  const repo = $('#tr-repo').value || '.';
  const out = $('#tr-output');
  out.style.display = 'block';
  out.textContent = 'Выполняется...';
  try {
    const r = await fetch(API + '/api/agents/' + name + '/test-run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, repo }),
    });
    const j = await r.json();
    out.textContent = j.output || j.error || 'empty';
    if (j.ok) toast('Test run completed');
    else toast('Test run failed: ' + (j.error || 'unknown'), 'err');
  } catch(e) {
    out.textContent = 'Error: ' + e.message;
    toast('Test run error: ' + e.message, 'err');
  }
}

// ===================================================================== EXPORT

function exportAgent(name) {
  window.open(API + '/api/agents/' + name + '/export', '_blank');
}

// init
loadJobs();
// не перезагружать settings, пока открыт редактор агента — иначе loadSettings
// сносит DOM и editor пропадает
setInterval(() => {
  const tab = $('nav button.active')?.dataset?.tab;
  if (tab === 'settings') {
    const ed = $('#agent-editor');
    if (ed && !['', 'none'].includes(ed.style.display)) return;
  }
  // For jobs tab, SSE handles updates, so we don't need polling
  if (tab === 'jobs') {
    // SSE is already running via loadJobs()
    return;
  }
  (routes[tab] || loadJobs)();
}, 5000);
</script>
