<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.ai — дашборд</title>
<style>
:root {
  --bg: #fff; --fg: #1a1a1a; --muted: #6b7280;
  --border: #e5e7eb; --accent: #2563eb; --accent-bg: #eff6ff;
  --red: #dc2626; --green: #16a34a; --yellow: #ca8a04;
  --row-hover: #f9fafb; --card: #fff; --input-bg: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af;
    --border: #374151; --accent: #60a5fa; --accent-bg: #1e3a5f;
    --red: #f87171; --green: #4ade80; --yellow: #facc15;
    --row-hover: #1f2937; --card: #1f2937; --input-bg: #374151;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
header h1 { font-size: 16px; font-weight: 600; }
nav { display: flex; gap: 4px; }
nav button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; font-size: 13px; }
nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
main { padding: 16px 20px; max-width: 1400px; }
.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filters select, .filters input { padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--input-bg); color: var(--fg); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--accent); }
th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--bg); }
tr:hover td { background: var(--row-hover); }
tr { cursor: pointer; }
.status { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.status.completed { background: #dcfce7; color: #166534; }
.status.failed { background: #fef2f2; color: #991b1b; }
.status.running { background: #dbeafe; color: #1e40af; }
.status.killed { background: #fef3c7; color: #92400e; }
.status.pending { background: #f3f4f6; color: #6b7280; }
.status.warning { background: #fef3c7; color: #92400e; }
.status.diag-error { background: #fff7ed; color: #9a3412; }
@media (prefers-color-scheme: dark) {
  .status.completed { background: #14532d; color: #86efac; }
  .status.failed { background: #7f1d1d; color: #fca5a5; }
  .status.running { background: #1e3a5f; color: #93c5fd; }
  .status.killed { background: #713f12; color: #fde68a; }
  .status.pending { background: #374151; color: #d1d5db; }
  .status.warning { background: #713f12; color: #fde68a; }
  .status.diag-error { background: #7c2d12; color: #fdba74; }
}
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card h3 { font-size: 14px; margin-bottom: 8px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center; }
.stat .val { font-size: 28px; font-weight: 700; }
.stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chart { display: flex; align-items: flex-end; gap: 2px; height: 80px; margin: 8px 0; }
.chart div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; }
.detail-panel { position: fixed; top: 0; right: 0; width: min(780px, 100%); height: 100vh; background: var(--bg); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; z-index: 10; box-shadow: -4px 0 12px rgba(0,0,0,.08); display: none; }
.detail-panel.open { display: block; }
.detail-panel .close { position: sticky; top: 8px; float: right; background: var(--border); border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 14px; color: var(--fg); }
.detail-panel pre { background: var(--row-hover); padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.detail-panel .field { margin-bottom: 6px; }
.detail-panel .field .k { color: var(--muted); font-size: 11px; }
.detail-panel .field .v { font-size: 13px; }
label { font-size: 12px; color: var(--muted); display: block; margin-top: 8px; }
input[type=text], select { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--input-bg); color: var(--fg); font-size: 13px; margin-top: 2px; }
button.primary { padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 12px; }
button.danger { padding: 8px 20px; background: var(--red); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 12px; }
.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,.3); z-index: 9; }
.overlay.open { display: block; }
.pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 12px; }
.pagination button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; font-size: 13px; }
.pagination button:disabled { opacity: 0.4; cursor: default; }
.pagination span { font-size: 13px; color: var(--muted); }
.spark { display: flex; gap: 1px; margin: 8px 0; }
.spark span { width: 6px; background: var(--accent); border-radius: 0 0 2px 2px; }
/* animations */
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.pulse { animation: pulse 1.5s ease-in-out infinite; }
.agent-card { transition: transform .15s, box-shadow .15s; }
.agent-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
/* toast */
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 10px 16px; border-radius: 6px; font-size: 13px; color: #fff; animation: fadeIn .2s; max-width: 360px; }
.toast.ok { background: var(--green); }
.toast.err { background: var(--red); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
/* tooltip */
.tip { position: relative; border-bottom: 1px dotted var(--muted); cursor: help; }
.tip .tt { display: none; position: absolute; bottom: calc(100% + 6px); left: 0; background: var(--fg); color: var(--bg); font-size: 11px; line-height: 1.4; padding: 6px 10px; border-radius: 5px; white-space: normal; width: 260px; z-index: 99; pointer-events: none; }
.tip:hover .tt { display: block; }
.tip .tt::after { content: ''; position: absolute; top: 100%; left: 12px; border: 5px solid transparent; border-top-color: var(--fg); }
label .tip { font-weight: normal; }
/* modal */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,.4); z-index: 50; justify-content: center; align-items: center; }
.modal.open { display: flex; }
.modal .box { background: var(--card); border-radius: 10px; padding: 24px; width: 500px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal .box h3 { margin-bottom: 12px; }
/* session log */
#session-log { margin-top: 16px; }
.sess-step { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; overflow: hidden; }
.sess-step.sess-finish { opacity: 0.65; font-size: 12px; }
.sess-step.sess-start { border-style: dashed; opacity: 0.5; }
.sess-header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; user-select: none; font-size: 13px; }
.sess-header:hover { background: var(--row-hover); }
.sess-body { display: none; padding: 8px 10px; border-top: 1px solid var(--border); background: var(--row-hover); }
.sess-step.open .sess-body { display: block; }
.sess-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; font-family: monospace; background: var(--accent-bg); color: var(--accent); min-width: 48px; text-align: center; }
.sess-tag.step-start { background: #f3f4f6; color: var(--muted); }
.sess-tag.step-finish { background: #f0fdf4; color: var(--green); }
.sess-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-title.step-start { color: var(--muted); }
.sess-meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
.sess-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
.sess-error { color: var(--red); font-size: 12px; }
.sess-section-label { font-size: 11px; color: var(--muted); margin: 6px 0 2px 0; text-transform: uppercase; }
/* agent editor sections */
.ae-section {
  background: var(--row-hover);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 14px;
}
.ae-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.ae-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.ae-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.ae-full { grid-column: 1 / -1; }
.ae-section label { margin-top: 0; }
/* MCP checkboxes */
.mcp-list { display: flex; flex-wrap: wrap; gap: 6px; }
.mcp-item {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 12px; cursor: pointer; user-select: none;
  background: var(--card); transition: background .1s;
}
.mcp-item:hover { background: var(--row-hover); }
.mcp-item.checked { background: var(--accent-bg); border-color: var(--accent); }
.mcp-item input[type=checkbox] { display: none; }
.mcp-item .mcp-checked-icon { color: var(--accent); font-weight: bold; display: none; }
.mcp-item.checked .mcp-checked-icon { display: inline; }
.mcp-item .mcp-name { color: var(--fg); }
.mcp-item .mcp-disabled-tag { color: var(--muted); font-size: 10px; }
.mcp-item .mcp-stale-tag { color: var(--yellow); font-size: 10px; }
.mcp-item.mcp-stale { border-style: dashed; opacity: 0.8; }
.mcp-item.mcp-stale.checked { opacity: 1; }
/* agent cards layout */
.agent-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 20px; }
.agent-card-inner { cursor: pointer; }
/* editor card */
#agent-editor { max-width: 860px; }
#agent-editor h3 { margin-bottom: 12px; font-size: 15px; }
.ae-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
textarea { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border); border-radius: 5px; padding: 8px; }

/* ---- общие мелочи */
.muted { color: var(--muted); }
.small { font-size: 11px; }
code { font-family: monospace; font-size: 12px; background: var(--row-hover); padding: 0 4px; border-radius: 3px; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; line-height: 1.8; }
.empty.err { color: var(--red); }
.empty button, button.mini { padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; font-size: 12px; }
.jobs-count { margin-left: auto; align-self: center; color: var(--muted); font-size: 12px; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--accent); }
td.task { max-width: 460px; overflow: hidden; text-overflow: ellipsis; }
tr.selected td { background: var(--accent-bg); }
tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.filters select { width: auto; margin-top: 0; }
.filters input[type=search] { width: 240px; margin: 0; }

/* ---- статусы «пауза» (лимит шагов) и «продолжена» — не ошибки */
.status.paused { background: #fef9c3; color: #854d0e; border: 1px dashed #ca8a04; }
.status.continued { background: transparent; color: var(--muted); border: 1px dashed var(--border); }
@media (prefers-color-scheme: dark) {
  .status.paused { background: #422006; color: #fde68a; border-color: #a16207; }
}

/* ---- связка задач одной сессии в таблице: точка + вертикальная линия «1/3 → 2/3 → 3/3» */
th.chain, td.chain { width: 62px; padding: 0 4px 0 8px; position: relative; white-space: nowrap; }
td.chain .ch-n { font-size: 10px; color: var(--muted); margin-left: 4px; position: relative; z-index: 1; }
.ch-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); border: 2px solid var(--bg); box-sizing: content-box; vertical-align: middle; position: relative; z-index: 1; }
tr:hover .ch-dot { border-color: var(--row-hover); }
tr.selected .ch-dot { border-color: var(--accent-bg); }
.ch-dot.completed { background: var(--green); }
.ch-dot.failed { background: var(--red); }
.ch-dot.running { background: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
.ch-dot.paused { background: var(--yellow); }
.ch-dot.continued { background: var(--yellow); opacity: .5; }
.ch-dot.killed { background: #d97706; }
tr.ch-up td.chain::before, tr.ch-down td.chain::after { content: ''; position: absolute; left: 14px; width: 2px; background: var(--accent); opacity: .45; }
tr.ch-up td.chain::before { top: -1px; height: calc(50% + 1px); }
tr.ch-down td.chain::after { bottom: -1px; height: calc(50% + 1px); }
tr.ch-down td { border-bottom-style: dashed; }
.ch-arrow { color: var(--accent); }

/* ---- карточка задачи */
.detail-panel h3 { font-size: 16px; line-height: 1.3; margin: 2px 36px 8px 0; word-break: break-word; }
.d-sub { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12px; margin-bottom: 10px; }
.part-pill { background: var(--accent-bg); color: var(--accent); border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; }
.chain-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 12px; font-size: 12px; }
.chain-arrow { color: var(--muted); }
.cpill { display: inline-flex; align-items: center; gap: 2px; padding: 2px 10px 2px 4px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--fg); cursor: pointer; font-size: 12px; }
.cpill.cur { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
.cpill .ch-dot { margin-right: 2px; }
.problems { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.problem { border-radius: 6px; padding: 8px 10px; font-size: 13px; border-left: 3px solid; word-break: break-word; }
.problem.bad { background: #fef2f2; border-color: var(--red); color: #7f1d1d; }
.problem.warn { background: #fffbeb; border-color: var(--yellow); color: #78350f; }
.problem.pause { background: #fefce8; border-color: var(--yellow); color: #713f12; }
.problem .muted { color: inherit; opacity: .7; }
@media (prefers-color-scheme: dark) {
  .problem.bad { background: #3b1d1d; color: #fecaca; }
  .problem.warn, .problem.pause { background: #38290a; color: #fde68a; }
}
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 8px 0 12px; overflow-x: auto; }
.tab { padding: 7px 12px; border: none; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; font-size: 13px; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab-count { background: var(--border); color: var(--fg); border-radius: 8px; padding: 0 6px; font-size: 10px; margin-left: 3px; }
.pane { display: none; }
.pane.active { display: block; }
.detail-panel pre.plain, .detail-panel pre.code, .detail-panel pre.md-table { margin: 6px 0; }
.detail-panel pre.md-table { white-space: pre; word-break: normal; }
.md { font-size: 13px; line-height: 1.6; word-break: break-word; }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 10px 22px; }
.md .md-h { font-weight: 600; margin: 14px 0 6px; }
.md .md-h1 { font-size: 16px; } .md .md-h2 { font-size: 15px; } .md .md-h3, .md .md-h4 { font-size: 14px; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.md a { color: var(--accent); }
.cont-box { margin-top: 18px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--row-hover); }
.cont-box label { margin: 0 0 6px; color: var(--fg); font-weight: 600; font-size: 13px; }
.cont-box textarea { width: 100%; font: inherit; font-size: 13px; resize: vertical; }
.actions-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.actions-row button.primary, .actions-row button.danger { margin-top: 0; }
button.ghost-danger { padding: 8px 16px; border: 1px solid var(--red); background: transparent; color: var(--red); border-radius: 6px; cursor: pointer; font-size: 13px; }
details.tech { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 8px; }
details.tech summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details.tech .field { margin-top: 6px; }
details.tech .field .v { word-break: break-all; font-family: monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>.ai дашборд</h1>
  <nav>
    <button data-tab="jobs" class="active">Задачи</button>
    <button data-tab="stats">Статистика</button>
    <button data-tab="settings">Агенты</button>
  </nav>
  <span style="flex:1"></span>
  <span id="conn" role="button" tabindex="0" title="Состояние живого обновления. Клик — переподключиться" onclick="reconnectNow()" style="font-size:11px;color:var(--muted);cursor:pointer">◌ подключение…</span>
</header>

<main id="main"></main>
<div class="overlay" id="overlay"></div>
<div class="detail-panel" id="detail"></div>
<div class="toast-container" id="toasts"></div>
<div class="modal" id="modal">
  <div class="box" id="modal-body"></div>
</div>

<script>
const API = '';

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

async function get(url, opts) {
  opts = opts || {};
  var finalUrl = API + url;
  if (opts.nocache) {
    finalUrl += (finalUrl.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now();
  }
  const r = await fetch(finalUrl);
  if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
  return r.json();
}

// Возвращает JSON даже для 4xx/5xx: сервер кладёт текст ошибки в { error }.
async function post(url, body) {
  const r = await fetch(API + url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {})
  });
  return r.json();
}

// Экранирует и кавычки тоже: значения попадают в атрибуты (title, data-*).
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const WARNING_TEXT = {
  no_changes: 'агент не внёс изменений, хотя проверка прошла',
  not_autocommitted: 'остались незакоммиченные изменения, авто-коммит обёртки не сработал',
  stale_running: 'давно нет вывода — задача могла зависнуть',
};

const OUTCOME_TEXT = {
  permission_rejected: 'Агент попытался выполнить запрещённое действие',
  validation_error: 'Агент вызвал инструмент с некорректными аргументами',
  abandoned: 'Агент остановился, не доведя шаг до конца',
  error: 'Ошибка на стороне раннера (сеть, API или сбой процесса)',
};

const INTEGRATION_TEXT = {
  accepted: 'принято в основную ветку',
  discarded: 'отброшено',
  empty: 'изменений не было — ветка удалена',
};

function statusBadge(s, healthWarnings) {
  let cls = 'status ' + esc(s);
  let title = '';
  if (healthWarnings && healthWarnings.length > 0) {
    cls += ' warning';
    const msgs = healthWarnings.map(function(w) { return WARNING_TEXT[w] || w; });
    title = ' title="⚠ ' + esc(msgs.join('; ')) + '"';
  }
  return '<span class="' + cls + '"' + title + '>' + esc(s) + '</span>';
}

function diagBadge(outcome, errorMsg) {
  if (!outcome) return '';
  var show = ['permission_rejected', 'validation_error', 'abandoned', 'error'];
  if (show.indexOf(outcome) === -1) return '';
  var title = errorMsg ? ' title="' + esc(errorMsg.slice(0, 120)) + '"' : '';
  return ' <span class="status diag-error"' + title + '>' + esc(outcome) + '</span>';
}

function fmtNum(n) {
  if (n == null) return '---';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function fmtCost(j) {
  if (j.cost == null) return '---';
  if (j.cost === 0) return '$0';
  return '$' + j.cost.toFixed(4);
}

function pct(n, total) {
  return total > 0 ? (100 * n / total).toFixed(0) + '%' : '---';
}

// ===================================================================== STATUS / ЦЕПОЧКИ

const PAUSE_HINT = 'Агент исчерпал лимит шагов и остановился. Это не ошибка — сессию можно продолжить.';

// Что показываем вместо «сырого» status. Задача, упёршаяся в лимит шагов,
// формально failed, но по сути — пауза: красная «ошибка» сбивала с толку.
function displayStatus(j, ch) {
  if (j.status === 'failed' && j.stopReason === 'max_steps') {
    if (ch && ch.nextId) {
      return { key: 'continued', label: 'продолжена →',
        title: 'Лимит шагов исчерпан — сессию продолжила следующая задача (' + (ch.index + 1) + '/' + ch.total + ')' };
    }
    return { key: 'paused', label: 'пауза', title: PAUSE_HINT };
  }
  return { key: j.status, label: j.status, title: '' };
}

function jobBadge(j, ch) {
  const ds = displayStatus(j, ch);
  if (ds.key === 'paused' || ds.key === 'continued') {
    return '<span class="status ' + ds.key + '" title="' + esc(ds.title) + '">' + ds.label + '</span>';
  }
  return statusBadge(j.status, j.healthWarnings);
}

const byCreated = (a, b) => (a.createdAt || '').localeCompare(b.createdAt || '') || String(a.id).localeCompare(String(b.id));

// Ключ сессии: все задачи, продолжающие одну сессию агента (agent send, heal),
// получают один sessionId. Для задач без sessionId идём по continuesJob к корню.
function chainKeyOf(j, byId) {
  if (j.sessionId) return 's:' + j.sessionId;
  let cur = j, guard = 0;
  while (cur.continuesJob && byId.has(cur.continuesJob) && guard++ < 50) cur = byId.get(cur.continuesJob);
  return cur.sessionId ? 's:' + cur.sessionId : 'j:' + cur.id;
}

// jobId -> { key, index (с 1), total, prevId, nextId, members }
function buildChains(jobs) {
  const byId = new Map(jobs.map(j => [j.id, j]));
  const groups = new Map();
  for (const j of jobs) {
    const k = chainKeyOf(j, byId);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(j);
  }
  const info = new Map();
  for (const [key, members] of groups) {
    members.sort(byCreated);
    members.forEach((m, i) => info.set(m.id, {
      key, index: i + 1, total: members.length,
      prevId: i > 0 ? members[i - 1].id : null,
      nextId: i < members.length - 1 ? members[i + 1].id : null,
      members,
    }));
  }
  return info;
}

// ===================================================================== JOBS

let jobsCache = [];
let jobsLoaded = false;
let chainsMemo = new Map();
let sortField = 'createdAt';
let sortDir = -1;  // -1 = по убыванию (новые сверху), 1 = по возрастанию
let pageSize = 50;
let currentOffset = 0;
let activeTab = 'jobs';
const filters = { status: '', model: '', search: '' };

// ---- живое соединение (WebSocket с переподключением)

let ws = null;
let wsRetry = 0;
let wsTimer = null;
let pendingOpen = null; // id только что созданной задачи — откроем карточку, когда она придёт по сокету

function setConn(state, sec) {
  const el = $('#conn');
  if (!el) return;
  if (state === 'online') { el.style.color = 'var(--green)'; el.textContent = '● онлайн'; }
  else if (state === 'connecting') { el.style.color = 'var(--yellow)'; el.textContent = '◌ подключение…'; }
  else { el.style.color = 'var(--red)'; el.textContent = '○ нет связи' + (sec ? ' · повтор через ' + sec + ' с' : ''); }
}

function connectLive() {
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
  clearTimeout(wsTimer);
  setConn('connecting');
  let sock;
  try {
    sock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  } catch (e) {
    scheduleReconnect();
    return;
  }
  ws = sock;
  let first = true;
  sock.onopen = () => { wsRetry = 0; setConn('online'); };
  sock.onmessage = (e) => {
    try {
      applyLiveMessage(JSON.parse(e.data), first);
      first = false;
    } catch (err) {
      console.error('WebSocket message error:', err);
    }
  };
  sock.onclose = () => {
    if (ws !== sock) return; // это уже заменённый сокет
    ws = null;
    scheduleReconnect();
  };
  sock.onerror = () => { /* следом придёт onclose — переподключимся там */ };
}

// Переподключение с нарастающей паузой (1, 2, 4 … 15 с) — независимо от вкладки:
// кэш задач живёт между вкладками, поэтому обновляется всегда.
function scheduleReconnect() {
  const delay = Math.min(1000 * Math.pow(2, wsRetry), 15000);
  wsRetry++;
  setConn('offline', Math.round(delay / 1000));
  clearTimeout(wsTimer);
  wsTimer = setTimeout(connectLive, delay);
  // без сокета хотя бы покажем последние задачи по REST
  if (!jobsLoaded) fallbackLoad();
}

async function fallbackLoad() {
  try {
    const data = await get('/api/jobs?limit=200');
    if (jobsLoaded) return; // сокет успел раньше — его данные свежее
    setJobs(data.jobs || []);
    renderJobs();
  } catch (e) { /* сервер недоступен — индикатор уже красный */ }
}

// Единая точка записи кэша: цепочки пересчитываем сразу, а не при рендере —
// карточка задачи читает их и тогда, когда открыта другая вкладка.
function setJobs(list) {
  jobsCache = list;
  jobsLoaded = true;
  chainsMemo = buildChains(jobsCache);
}

function reconnectNow() {
  clearTimeout(wsTimer);
  if (ws) { const old = ws; ws = null; old.onclose = null; try { old.close(); } catch (e) {} }
  wsRetry = 0;
  connectLive();
}

// Первое сообщение после подключения — полный снимок: по нему вычищаем из кэша
// задачи, удалённые за время обрыва (раньше они оставались «призраками»).
function applyLiveMessage(updates, first) {
  if (!Array.isArray(updates)) return;
  const byId = new Map(first ? [] : jobsCache.map(j => [j.id, j]));
  for (const msg of updates) {
    if (msg.type === 'job_updated' && msg.job) byId.set(msg.job.id, msg.job);
    else if (msg.type === 'job_deleted' && msg.jobId) byId.delete(msg.jobId);
  }
  setJobs([...byId.values()]);
  renderJobs();
  afterJobsChanged();
}

function afterJobsChanged() {
  if (pendingOpen && jobsCache.some(j => j.id === pendingOpen)) {
    const id = pendingOpen; pendingOpen = null;
    openDetail(id);
    return;
  }
  if (!openJobId) return;
  // карточка открыта: перечитываем её, если у задачи сменился статус или в сессию добавилась часть
  const j = jobsCache.find(x => x.id === openJobId);
  const ch = chainsMemo.get(openJobId);
  const sig = j ? [j.status, j.stopReason, j.finishedAt, j.verifyStatus, j.integration, ch ? ch.total : 0].join('|') : 'gone';
  if (sig !== detailSig) refreshDetail();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  // после долгого сна вкладки сокет мог «зависнуть» молча — переподключаемся
  if (hiddenAt && Date.now() - hiddenAt > 60000) reconnectNow(); else connectLive();
});
let hiddenAt = 0;
window.addEventListener('online', reconnectNow);

// ---- таблица

function sortValue(j, field, ch) {
  switch (field) {
    case 'task': return (j.task || '').toLowerCase();
    case 'status': return displayStatus(j, ch).key;
    case 'model': return j.model || '';
    case 'cost': return j.cost == null ? -1 : j.cost;
    case 'tokens': return j.tokens ? (j.tokens.total || 0) : -1;
    case 'duration': {
      if (!j.startedAt) return -1;
      const end = j.finishedAt ? Date.parse(j.finishedAt) : Date.now();
      return end - Date.parse(j.startedAt);
    }
    default: return j.createdAt || '';
  }
}

function cmpVals(a, b) {
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  return String(a).localeCompare(String(b));
}

// Строки одной сессии идут подряд (1, 2, 3 сверху вниз), а сами сессии
// сортируются по своей последней части — так «свежая» сессия остаётся наверху.
function orderRows(list) {
  const groups = new Map();
  for (const j of list) {
    const k = chainsMemo.get(j.id).key;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(j);
  }
  const arr = [...groups.values()];
  for (const g of arr) g.sort(byCreated);
  const rep = (g) => g[g.length - 1];
  arr.sort((ga, gb) => {
    const a = rep(ga), b = rep(gb);
    return sortDir * cmpVals(sortValue(a, sortField, chainsMemo.get(a.id)), sortValue(b, sortField, chainsMemo.get(b.id)));
  });
  return arr.flat();
}

const SORT_COLS = [
  ['task', 'Задача'], ['status', 'Статус'], ['model', 'Модель'], [null, 'Проверка'],
  ['createdAt', 'Создана'], ['duration', 'Длит.'], ['cost', 'Стоимость'], ['tokens', 'Токены'],
];

function ensureJobsSkeleton() {
  const main = $('#main');
  if (main.querySelector('#jobs-root')) return;
  // Каркас строится один раз: фильтры живут в DOM постоянно, поэтому ввод в
  // поиске не теряет фокус при каждом обновлении (раньше фильтры пересоздавались).
  main.innerHTML =
    '<div id="jobs-root">' +
    '<div class="filters">' +
      '<select id="filter-status" aria-label="Статус"><option value="">все статусы</option>' +
        ['completed','running','paused','failed','killed','pending'].map(s => '<option value="' + s + '">' + s + '</option>').join('') +
      '</select>' +
      '<select id="filter-model" aria-label="Модель"><option value="">все модели</option></select>' +
      '<input id="filter-search" type="search" placeholder="поиск по задаче или ID…" autocomplete="off" aria-label="Поиск">' +
      '<span id="jobs-count" class="jobs-count"></span>' +
    '</div>' +
    '<div id="jobs-table"></div>' +
    '<div class="pagination" id="jobs-pagination"></div>' +
    '</div>';

  // фильтры запоминаем в объекте: при переходе на другую вкладку и обратно каркас
  // пересоздаётся, а выбранное должно остаться
  const reset = () => { currentOffset = 0; renderJobs(); };
  $('#filter-status').addEventListener('change', (e) => { filters.status = e.target.value; reset(); });
  $('#filter-model').addEventListener('change', (e) => { filters.model = e.target.value; reset(); });
  $('#filter-search').addEventListener('input', (e) => { filters.search = e.target.value; reset(); });

  const table = $('#jobs-table');
  table.addEventListener('click', (e) => {
    const th = e.target.closest('th[data-sort]');
    if (th) { setSort(th.dataset.sort); return; }
    if (e.target.closest('[data-act="reset"]')) { resetFilters(); return; }
    const tr = e.target.closest('tr[data-id]');
    if (tr) openDetail(tr.dataset.id);
  });
  table.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const tr = e.target.closest('tr[data-id]');
    if (tr) { e.preventDefault(); openDetail(tr.dataset.id); }
  });
  $('#jobs-pagination').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b || b.disabled) return;
    if (b.dataset.act === 'prev') prevPage(); else if (b.dataset.act === 'next') nextPage();
  });
}

function setSort(field) {
  if (sortField === field) sortDir = -sortDir;
  else { sortField = field; sortDir = (field === 'task' || field === 'model' || field === 'status') ? 1 : -1; }
  currentOffset = 0;
  renderJobs();
}

function resetFilters() {
  filters.status = ''; filters.model = ''; filters.search = '';
  currentOffset = 0;
  $('#filter-model').value = '';
  renderJobs();
}

function matchesStatus(j, f) {
  const paused = j.status === 'failed' && j.stopReason === 'max_steps';
  if (f === 'paused') return paused;
  if (f === 'failed') return j.status === 'failed' && !paused;
  return j.status === f;
}

function renderJobs() {
  if (activeTab !== 'jobs') return; // WS-обновления не должны рисовать таблицу поверх других вкладок
  ensureJobsSkeleton();

  // значения фильтров из памяти → в элементы (нужно после пересоздания каркаса).
  // Поле поиска трогаем только при расхождении, чтобы не сбить курсор при вводе.
  if ($('#filter-status').value !== filters.status) $('#filter-status').value = filters.status;
  if ($('#filter-search').value !== filters.search) $('#filter-search').value = filters.search;

  // список моделей в фильтре обновляем только если он изменился
  const models = [...new Set(jobsCache.map(j => j.model))].sort();
  const sig = models.join('|');
  const modelSel = $('#filter-model');
  if (modelSel.dataset.sig !== sig) {
    modelSel.dataset.sig = sig;
    modelSel.innerHTML = '<option value="">все модели</option>' +
      models.map(m => '<option value="' + esc(m) + '">' + esc(m) + '</option>').join('');
    if (models.indexOf(filters.model) < 0) filters.model = '';
    modelSel.value = filters.model;
  }

  const fStatus = filters.status;
  const fModel = filters.model;
  const fSearch = filters.search.trim().toLowerCase();

  const filtered = jobsCache.filter(j => {
    if (fStatus && !matchesStatus(j, fStatus)) return false;
    if (fModel && j.model !== fModel) return false;
    if (fSearch && !((j.id || '') + ' ' + (j.task || '') + ' ' + (j.promptPreview || '')).toLowerCase().includes(fSearch)) return false;
    return true;
  });
  const list = orderRows(filtered);

  if (currentOffset >= list.length && list.length > 0) {
    currentOffset = Math.max(0, Math.floor((list.length - 1) / pageSize) * pageSize);
  }
  const pageItems = list.slice(currentOffset, currentOffset + pageSize);

  $('#jobs-count').textContent = list.length + ' из ' + jobsCache.length;

  const holder = $('#jobs-table');
  if (!jobsLoaded) {
    holder.innerHTML = '<div class="empty">Загрузка…</div>';
  } else if (jobsCache.length === 0) {
    holder.innerHTML = '<div class="empty">Задач пока нет.<br><span class="muted">Запусти первую: <code>agent delegate coding "…"</code></span></div>';
  } else if (list.length === 0) {
    holder.innerHTML = '<div class="empty">Ничего не найдено по фильтрам. <button data-act="reset">Сбросить</button></div>';
  } else {
    holder.innerHTML = tableHtml(pageItems);
  }

  const totalPages = Math.ceil(list.length / pageSize) || 1;
  const currentPage = Math.floor(currentOffset / pageSize) + 1;
  $('#jobs-pagination').innerHTML = totalPages > 1
    ? '<button data-act="prev"' + (currentOffset <= 0 ? ' disabled' : '') + '>← новее</button>' +
      '<span>' + currentPage + ' из ' + totalPages + '</span>' +
      '<button data-act="next"' + (currentOffset + pageSize >= list.length ? ' disabled' : '') + '>старее →</button>'
    : '';
}

function tableHtml(items) {
  const arrow = (f) => f === sortField ? (sortDir === -1 ? ' ▼' : ' ▲') : '';
  let h = '<table><thead><tr><th class="chain"></th>';
  for (const [field, label] of SORT_COLS) {
    h += field
      ? '<th class="sortable" data-sort="' + field + '">' + label + arrow(field) + '</th>'
      : '<th>' + label + '</th>';
  }
  h += '</tr></thead><tbody>';

  items.forEach((j, i) => {
    const ch = chainsMemo.get(j.id);
    // соседи по сессии среди видимых строк — от них зависит, рисовать ли линию-связку
    const hasUp = ch.total > 1 && i > 0 && chainsMemo.get(items[i - 1].id).key === ch.key;
    const hasDown = ch.total > 1 && i < items.length - 1 && chainsMemo.get(items[i + 1].id).key === ch.key;
    h += rowHtml(j, ch, hasUp, hasDown);
  });
  return h + '</tbody></table>';
}

function rowHtml(j, ch, hasUp, hasDown) {
  const ds = displayStatus(j, ch);
  const created = j.createdAt ? j.createdAt.slice(0, 16).replace('T', ' ') : '---';
  const cls = ['job-row'];
  if (ch.total > 1) cls.push('in-chain');
  if (hasUp) cls.push('ch-up');
  if (hasDown) cls.push('ch-down');
  if (j.id === openJobId) cls.push('selected');

  const tip = j.id + '\nсоздана: ' + (j.createdAt || '') + '\nзапущена: ' + (j.startedAt || '') + '\nзавершена: ' + (j.finishedAt || '');

  let chainCell = '<td class="chain"></td>';
  if (ch.total > 1) {
    chainCell = '<td class="chain" title="Сессия агента: часть ' + ch.index + ' из ' + ch.total + '">' +
      '<span class="ch-dot ' + esc(ds.key) + '"></span><span class="ch-n">' + ch.index + '/' + ch.total + '</span></td>';
  }

  // продолжение показываем по своему сообщению («допиши тесты»), а не повтором названия задачи
  let taskCell;
  if (hasUp) {
    taskCell = '<span class="ch-arrow">↳</span> <span class="muted">продолжение:</span> ' + esc(j.promptPreview || j.task || '');
  } else {
    taskCell = esc(j.task || '');
  }

  let h = '<tr class="' + cls.join(' ') + '" data-id="' + esc(j.id) + '" tabindex="0" title="' + esc(tip) + '">';
  h += chainCell;
  h += '<td class="task">' + taskCell + '</td>';
  h += '<td>' + jobBadge(j, ch) + diagBadge(j.diagnosisOutcome, j.diagnosisError) + '</td>';
  h += '<td>' + esc(j.model) + (j.variant ? ' <span class="muted">· ' + esc(j.variant) + '</span>' : '') + '</td>';
  h += '<td>' + (j.verifyStatus ? statusBadge(j.verifyStatus) : (j.verifyCmd ? '---' : '<span class="muted">не требуется</span>')) + '</td>';
  h += '<td class="muted small">' + esc(created) + '</td>';
  const dur = (j.status === 'running' && j.startedAt) ? fmtDuration(j.startedAt, new Date().toISOString()) : j.duration;
  h += '<td class="muted">' + esc(dur) + '</td>';
  h += '<td>' + fmtCost(j) + '</td>';
  h += '<td>' + (j.tokens ? fmtNum(j.tokens.total) : '---') + '</td>';
  return h + '</tr>';
}

function prevPage() {
  if (currentOffset <= 0) return;
  currentOffset = Math.max(0, currentOffset - pageSize);
  renderJobs();
}

function nextPage() {
  currentOffset += pageSize;
  renderJobs();
}

function showJobs() {
  renderJobs();
  connectLive();
}

// ===================================================================== MARKDOWN (минимальный, безопасный)

function mdInline(s) {
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)"'&]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}

function mdBlock(text) {
  const out = [];
  let list = null, para = [], tbl = [];
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(mdInline).join('<br>') + '</p>'); para = []; } };
  const flushList = () => {
    if (list) { out.push('<' + list.tag + '>' + list.items.map(i => '<li>' + mdInline(i) + '</li>').join('') + '</' + list.tag + '>'); list = null; }
  };
  const flushTbl = () => { if (tbl.length) { out.push('<pre class="md-table">' + esc(tbl.join('\n')) + '</pre>'); tbl = []; } };
  const flushAll = () => { flushPara(); flushList(); flushTbl(); };

  for (const line of text.split(/\r?\n/)) {
    let m;
    if (!line.trim()) { flushAll(); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) { flushPara(); flushList(); tbl.push(line); continue; }
    flushTbl();
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flushAll(); out.push('<div class="md-h md-h' + Math.min(m[1].length, 4) + '">' + mdInline(m[2]) + '</div>'); continue; }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flushAll(); out.push('<hr>'); continue; }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
      flushPara();
      if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
      list.items.push(m[1]); continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      flushPara();
      if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
      list.items.push(m[1]); continue;
    }
    flushList();
    para.push(line);
  }
  flushAll();
  return out.join('');
}

function md(src) {
  // чётные куски — обычный текст, нечётные — блоки кода между ```
  return String(src).split('```').map((part, i) => {
    if (i % 2 === 0) return mdBlock(part);
    const code = part.replace(/^[\w+-]*\r?\n/, '');
    return '<pre class="code">' + esc(code.replace(/\n$/, '')) + '</pre>';
  }).join('');
}

// ===================================================================== DETAIL

let openJobId = null;
let detailTab = 'result';   // выбранная вкладка помнится при переходе между задачами
let detailSig = '';
let progressLoadedFor = null;

function detailField(k, v) {
  if (v == null || v === '') return '';
  return '<div class="field"><div class="k">' + esc(k) + '</div><div class="v">' + esc(String(v)) + '</div></div>';
}

function markSelectedRow() {
  $$('#jobs-table tr.selected').forEach(tr => tr.classList.remove('selected'));
  if (!openJobId) return;
  $$('#jobs-table tr[data-id]').forEach(tr => { if (tr.dataset.id === openJobId) tr.classList.add('selected'); });
}

async function openDetail(id, keepState) {
  openJobId = id;
  const panel = $('#detail');
  panel.classList.add('open');
  $('#overlay').classList.add('open');
  if (!keepState) panel.innerHTML = '<button class="close" data-act="close" aria-label="Закрыть">✕</button><div class="empty">Загрузка…</div>';
  markSelectedRow();

  let d;
  try {
    d = await get('/api/jobs/' + encodeURIComponent(id));
  } catch (e) {
    if (openJobId !== id) return;
    detailSig = 'gone'; // иначе каждое WS-обновление снова пыталось бы перечитать удалённую задачу
    panel.innerHTML = '<button class="close" data-act="close" aria-label="Закрыть">✕</button>' +
      '<div class="empty err">Не удалось загрузить задачу: ' + esc(e.message) + '<br><span class="muted">Возможно, она уже удалена.</span></div>';
    return;
  }
  if (openJobId !== id) return; // пока грузили, открыли другую
  renderDetail(d, !!keepState);
}

function refreshDetail() {
  if (openJobId) openDetail(openJobId, true);
}

function problemsHtml(d) {
  const items = [];
  const warn = (cls, text) => items.push('<div class="problem ' + cls + '">' + text + '</div>');

  if (d.stopReason === 'max_steps') {
    warn('pause', '<strong>Пауза: лимит шагов исчерпан.</strong> Это не сбой — агент остановился, а сессию можно продолжить.');
  } else if (d.status === 'failed' || d.error) {
    if (d.error) warn('bad', '<strong>Ошибка:</strong> ' + esc(String(d.error).slice(0, 400)));
  }
  const dg = d.diagnosis;
  if (dg && OUTCOME_TEXT[dg.outcome] && !(dg.outcome === 'error' && d.error)) {
    warn('bad', '<strong>' + esc(OUTCOME_TEXT[dg.outcome]) + '.</strong>' +
      (dg.lastErrorMessage ? ' <span class="muted">' + esc(String(dg.lastErrorMessage).slice(0, 160)) + '</span>' : ''));
  }
  if (d.verifyStatus === 'failed') {
    warn('bad', '<strong>Проверка не пройдена</strong>' + (d.verifyExitCode != null ? ' (код ' + esc(d.verifyExitCode) + ')' : '') + ' — подробности во вкладке «Логи».');
  }
  for (const w of (d.healthWarnings || [])) warn('warn', '⚠ ' + esc(WARNING_TEXT[w] || w));
  return items.length ? '<div class="problems">' + items.join('') + '</div>' : '';
}

function chainNavHtml(ch, curId) {
  if (!ch || ch.total < 2) return '';
  let h = '<div class="chain-nav"><span class="muted">Сессия агента:</span> ';
  ch.members.forEach((m, i) => {
    const mch = chainsMemo.get(m.id);
    const ds = displayStatus(m, mch);
    const label = (m.promptPreview || m.task || '') + ' — ' + ds.label;
    if (i > 0) h += '<span class="chain-arrow">→</span>';
    h += '<button class="cpill ' + esc(ds.key) + (m.id === curId ? ' cur' : '') + '" data-open="' + esc(m.id) + '" title="' + esc(label) + '">' +
      '<span class="ch-dot ' + esc(ds.key) + '"></span>' + (i + 1) + '</button>';
  });
  return h + '</div>';
}

function renderDetail(d, keep) {
  const panel = $('#detail');
  const prevState = keep ? {
    top: panel.scrollTop,
    msg: ($('#cont-msg') || {}).value || '',
    focusId: document.activeElement && document.activeElement.id,
  } : null;

  const ch = chainsMemo.get(d.id) || null;
  const ds = displayStatus(d, ch);
  const isLast = !ch || !ch.nextId;
  const running = d.status === 'running';
  const integration = d.integration || (ch && (ch.members.find(m => m.integration) || {}).integration) || null;
  const canIntegrate = !!d.worktree && !integration && !running && isLast;

  detailSig = [d.status, d.stopReason, d.finishedAt, d.verifyStatus, d.integration, ch ? ch.total : 0].join('|');

  // ---- шапка
  const meta = [];
  if (d.startedAt) meta.push(fmtDuration(d.startedAt, d.finishedAt || new Date().toISOString()));
  if (d.cost != null) meta.push(fmtCost(d));
  if (d.tokens) meta.push(fmtNum(d.tokens.total) + ' токенов');
  const modelText = (d.model ? d.model.split('/').pop() : (d.runner || '')) + (d.variant ? ' · ' + d.variant : '');
  if (modelText) meta.push(modelText);

  let h = '<button class="close" data-act="close" aria-label="Закрыть (Esc)">✕</button>';
  h += '<h3>' + esc(d.task || d.id) + '</h3>';
  h += '<div class="d-sub">' + jobBadge(d, ch) + diagBadge(d.diagnosis && d.diagnosis.outcome, d.diagnosis && d.diagnosis.lastErrorMessage);
  if (ch && ch.total > 1) h += ' <span class="part-pill">часть ' + ch.index + ' из ' + ch.total + '</span>';
  h += ' <span class="muted">' + esc(meta.join(' · ')) + '</span></div>';
  h += chainNavHtml(ch, d.id);
  h += problemsHtml(d);

  // ---- вкладки
  const changesCount = d.changedFiles != null ? ' <span class="tab-count">' + esc(d.changedFiles) + '</span>' : '';
  const tabs = [['result', 'Результат'], ['prompt', 'ТЗ'], ['progress', 'Ход работы'], ['changes', 'Изменения' + changesCount], ['logs', 'Логи']];
  if (!keep && detailTab === 'result' && running) detailTab = 'progress'; // у работающей задачи результата ещё нет
  h += '<div class="tabs" role="tablist">' + tabs.map(([k, label]) =>
    '<button class="tab' + (k === detailTab ? ' active' : '') + '" role="tab" data-tab="' + k + '">' + label + '</button>').join('') + '</div>';

  // Результат
  let result;
  if (d.resultMd && d.resultMd.trim()) {
    const cut = d.resultMd.length > 60000;
    result = '<div class="md">' + md(cut ? d.resultMd.slice(0, 60000) : d.resultMd) + '</div>' +
      (cut ? '<div class="muted small">…показаны первые 60 000 символов из ' + fmtNum(d.resultMd.length) + '</div>' : '');
  } else {
    result = '<div class="empty">' + (running ? 'Задача выполняется — результат появится после завершения. Смотри «Ход работы».' : '(результата нет)') + '</div>';
  }
  h += '<div class="pane' + (detailTab === 'result' ? ' active' : '') + '" data-pane="result">' + result + '</div>';

  // ТЗ
  const promptLabel = d.continuesJob
    ? 'Сообщение для продолжения сессии' + (ch ? ' (часть ' + ch.index + ' из ' + ch.total + ')' : '')
    : 'Что было поручено агенту';
  h += '<div class="pane' + (detailTab === 'prompt' ? ' active' : '') + '" data-pane="prompt">' +
    '<div class="muted small" style="margin-bottom:6px">' + promptLabel + '</div>' +
    (d.promptMd ? '<pre class="plain">' + esc(d.promptMd) + '</pre>' : '<div class="empty">(ТЗ не сохранено)</div>') + '</div>';

  // Ход работы (лог сессии подгружается при открытии вкладки)
  h += '<div class="pane' + (detailTab === 'progress' ? ' active' : '') + '" data-pane="progress">' +
    '<div style="display:flex;justify-content:flex-end"><button data-act="refresh-log" class="mini">↻ обновить</button></div>' +
    '<div id="session-log"><div class="sess-empty">загрузка...</div></div></div>';

  // Изменения
  let chg = '';
  chg += detailField('изменено файлов', d.changedFiles != null ? d.changedFiles : null);
  if (d.diffStat) chg += '<pre class="plain">' + esc(d.diffStat) + '</pre>';
  chg += detailField('ветка', d.branch);
  chg += detailField('база', d.baseBranch);
  if (d.autoCommitted != null) chg += detailField('авто-коммит', d.autoCommitted ? 'да (обёртка закоммитила за агента)' : 'нет — остались незакоммиченные изменения');
  if (d.verifyCmd) chg += detailField('проверка', d.verifyCmd + ' → ' + (d.verifyStatus || 'не запускалась'));
  if (d.worktree) chg += detailField('состояние ветки', integration ? INTEGRATION_TEXT[integration] || integration : 'ждёт решения');
  if (!chg) chg = '<div class="empty">(данных об изменениях нет)</div>';
  if (canIntegrate) {
    chg += '<div class="actions-row">' +
      '<button class="primary" data-act="accept">✓ Принять изменения</button>' +
      '<button data-act="discard" class="ghost-danger">Отбросить ветку</button></div>' +
      '<div class="muted small">«Принять» делает squash-мердж ветки в текущую ветку основного репозитория и убирает worktree.</div>';
  } else if (d.worktree && !integration && !running && !isLast) {
    chg += '<div class="muted small" style="margin-top:8px">Принять или отбросить ветку можно в последней части сессии.</div>';
  }
  h += '<div class="pane' + (detailTab === 'changes' ? ' active' : '') + '" data-pane="changes">' + chg + '</div>';

  // Логи
  h += '<div class="pane' + (detailTab === 'logs' ? ' active' : '') + '" data-pane="logs">' +
    '<div class="sess-section-label">stderr (последние 100 строк)</div>' +
    (d.stderrTail && d.stderrTail.trim() ? '<pre class="plain">' + esc(d.stderrTail) + '</pre>' : '<div class="muted small">пусто</div>') +
    '<div class="sess-section-label">проверка (verify.log)</div>' +
    (d.verifyLogTail && d.verifyLogTail.trim() ? '<pre class="plain">' + esc(d.verifyLogTail) + '</pre>' : '<div class="muted small">пусто</div>') +
    '</div>';

  // ---- продолжить сессию
  if (d.sessionId) {
    if (running) {
      h += '<div class="cont-box"><div class="muted small">Задача выполняется. Дописать агенту можно после завершения — или останови её кнопкой ниже.</div></div>';
    } else if (isLast) {
      h += '<div class="cont-box"><label for="cont-msg">Продолжить сессию' + (d.stopReason === 'max_steps' ? ' <span class="muted">— агент остановился по лимиту шагов</span>' : '') + '</label>' +
        '<textarea id="cont-msg" rows="3" placeholder="Что дописать или уточнить агенту… (Ctrl+Enter — отправить)"></textarea>' +
        '<div class="actions-row"><button class="primary" data-act="send">Продолжить</button>' +
        '<span class="muted small">Создаст новую задачу в этой же сессии — агент помнит весь контекст.</span></div></div>';
    } else {
      h += '<div class="cont-box"><div class="muted small">Сессию уже продолжила следующая задача — ' +
        '<a href="#" data-open="' + esc(ch.nextId) + '">перейти к части ' + (ch.index + 1) + '</a>.</div></div>';
    }
  }

  // ---- действия
  h += '<div class="actions-row">';
  if (running) h += '<button class="danger" data-act="kill">🧹 Остановить задачу</button>';
  else h += '<button class="danger" data-act="delete">🗑 Удалить задачу</button>';
  h += '</div>';

  // ---- технические детали
  let tech = '';
  tech += detailField('ID', d.id);
  tech += detailField('сессия', d.sessionId);
  tech += detailField('раннер', d.runner);
  tech += detailField('директория', d.cwd);
  tech += detailField('код выхода', d.exitCode);
  tech += detailField('код проверки', d.verifyExitCode);
  tech += detailField('pid', d.pid);
  tech += detailField('создана', d.createdAt);
  tech += detailField('запущена', d.startedAt);
  tech += detailField('завершена', d.finishedAt);
  tech += detailField('продолжает задачу', d.continuesJob);
  tech += detailField('базовый коммит', d.baseCommit || d.startCommit);
  tech += detailField('принятый коммит', d.acceptedCommit);
  tech += detailField('попыток починки проверки', d.verifyRetryCount || null);
  h += '<details class="tech"><summary>Технические детали</summary>' + tech + '</details>';

  panel.innerHTML = h;

  if (prevState) {
    panel.scrollTop = prevState.top;
    const ta = $('#cont-msg');
    if (ta && prevState.msg) { ta.value = prevState.msg; if (prevState.focusId === 'cont-msg') ta.focus(); }
  }

  // лог сессии: подгружаем, если вкладка открыта (или задача сменилась статус — обновляем)
  if (detailTab === 'progress') { loadSessionLog(d.id); progressLoadedFor = d.id; }
  else progressLoadedFor = null;
  markSelectedRow();
}

function selectDetailTab(name) {
  detailTab = name;
  $$('#detail .tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $$('#detail .pane').forEach(p => p.classList.toggle('active', p.dataset.pane === name));
  if (name === 'progress' && progressLoadedFor !== openJobId) {
    progressLoadedFor = openJobId;
    loadSessionLog(openJobId);
  }
}

function closeDetail() {
  openJobId = null;
  progressLoadedFor = null;
  $('#detail').classList.remove('open');
  $('#overlay').classList.remove('open');
  markSelectedRow();
}

// Все кнопки карточки — через делегирование (id задачи не вставляем в onclick)
$('#detail').addEventListener('click', (e) => {
  const a = e.target.closest('[data-open]');
  if (a) { e.preventDefault(); openDetail(a.dataset.open); return; }
  const t = e.target.closest('[data-tab]');
  if (t) { selectDetailTab(t.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (!b || !openJobId) return;
  const id = openJobId;
  switch (b.dataset.act) {
    case 'close': closeDetail(); break;
    case 'kill': killJob(id); break;
    case 'delete': deleteJob(id); break;
    case 'accept': integrateJob(id, 'accept'); break;
    case 'discard': integrateJob(id, 'discard'); break;
    case 'send': sendToJob(id); break;
    case 'refresh-log': loadSessionLog(id); break;
  }
});
$('#detail').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'cont-msg' && openJobId) sendToJob(openJobId);
});

async function killJob(id) {
  if (!confirm('Остановить задачу ' + id + '? Процесс будет прерван.')) return;
  try {
    const j = await post('/api/jobs/' + encodeURIComponent(id) + '/kill');
    if (j.ok) { toast('Задача остановлена'); refreshDetail(); }
    else toast(j.error || 'Не удалось остановить задачу', 'err');
  } catch (e) {
    toast('Ошибка: ' + e.message, 'err');
  }
}

async function deleteJob(id) {
  if (!confirm('Удалить задачу ' + id + '? Это действие необратимо.')) return;
  try {
    const r = await fetch(API + '/api/jobs/' + encodeURIComponent(id), { method: 'DELETE' });
    const j = await r.json();
    if (j.ok) { toast('Задача удалена'); closeDetail(); }
    else toast(j.error || 'Не удалось удалить задачу', 'err');
  } catch (e) {
    toast('Ошибка: ' + e.message, 'err');
  }
}

async function integrateJob(id, action) {
  const q = action === 'accept'
    ? 'Принять изменения агента?\n\nВетка будет влита одним squash-коммитом в ТЕКУЩУЮ ветку основного репозитория, worktree и ветка удалятся.'
    : 'Отбросить ветку агента?\n\nВсе изменения агента в worktree будут потеряны.';
  if (!confirm(q)) return;
  try {
    const j = await post('/api/jobs/' + encodeURIComponent(id) + '/' + action);
    if (j.ok) { toast(j.output || (action === 'accept' ? 'Принято' : 'Отброшено')); refreshDetail(); }
    else toast(j.error || 'Не получилось', 'err');
  } catch (e) {
    toast('Ошибка: ' + e.message, 'err');
  }
}

async function sendToJob(id) {
  const ta = $('#cont-msg');
  const message = ta ? ta.value.trim() : '';
  if (!message) { toast('Напиши, что передать агенту', 'err'); if (ta) ta.focus(); return; }
  const btn = $('#detail [data-act="send"]');
  if (btn) btn.disabled = true;
  try {
    const j = await post('/api/jobs/' + encodeURIComponent(id) + '/send', { message });
    if (j.ok) {
      toast('Сессия продолжена — запущена новая задача');
      pendingOpen = j.jobId;
      setTimeout(() => { // если сокет не донёс новую задачу — откроем её сами
        if (pendingOpen === j.jobId) { pendingOpen = null; openDetail(j.jobId); }
      }, 5000);
    } else {
      toast(j.error || 'Не удалось продолжить сессию', 'err');
    }
  } catch (e) {
    toast('Ошибка: ' + e.message, 'err');
  } finally {
    if (btn) btn.disabled = false;
  }
}


// ===================================================================== SESSION LOG

function fmtDurationMs(ms) {
  if (ms == null) return '';
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  return Math.floor(ms / 60000) + 'm ' + Math.floor((ms % 60000) / 1000) + 's';
}

function toggleSessStep(el) {
  el.classList.toggle('open');
}

function renderSessionLog(steps) {
  if (!steps || steps.length === 0) {
    return '<div class="sess-empty">лог сессии пока пуст</div>';
  }
  let h = '';
  let stepNum = 0;
  for (const s of steps) {
    stepNum++;
    if (s.type === 'tool_use') {
      const tag = esc(s.tool || '?');
      const title = esc(s.title || s.tool || '');
      const dur = s.durationMs != null ? ' \u00b7 ' + fmtDurationMs(s.durationMs) : '';
      const status = s.status === 'completed' ? '' : ' \u00b7 <span style="color:var(--red)">' + esc(s.status) + '</span>';

      h += '<div class="sess-step" onclick="toggleSessStep(this)">';
      h += '<div class="sess-header">';
      h += '<span class="sess-tag">' + tag + '</span>';
      h += '<span class="sess-title">' + title + '</span>';
      h += '<span class="sess-meta">шаг ' + stepNum + dur + status + '</span>';
      h += '</div>';
      h += '<div class="sess-body">';

      // Input
      if (s.input && Object.keys(s.input).length > 0) {
        h += '<div class="sess-section-label">вход</div>';
        h += '<pre>' + esc(JSON.stringify(s.input, null, 2)) + '</pre>';
      }

      // Output
      if (s.output) {
        h += '<div class="sess-section-label">выход' + (s.outputTruncated ? ' (первые 2000 симв.)' : '') + '</div>';
        h += '<pre>' + esc(String(s.output)) + '</pre>';
      }

      h += '</div></div>';
    } else if (s.type === 'step_finish') {
      const tokens = s.tokens ? (fmtNum(s.tokens.total) + ' токенов (вход ' + fmtNum(s.tokens.input) + ', выход ' + fmtNum(s.tokens.output) + ')') : '';
      const cost = s.cost != null ? '$' + s.cost.toFixed(6) : '';
      const meta = [tokens, cost].filter(Boolean).join(' \u00b7 ');

      h += '<div class="sess-step sess-finish" onclick="toggleSessStep(this)">';
      h += '<div class="sess-header">';
      h += '<span class="sess-tag step-finish">step</span>';
      h += '<span class="sess-title">завершение шага</span>';
      h += '<span class="sess-meta">' + esc(meta) + '</span>';
      h += '</div>';
      h += '<div class="sess-body">';
      if (s.tokens) {
        h += '<pre>' + esc(JSON.stringify(s.tokens, null, 2)) + '</pre>';
      }
      if (s.cost != null) {
        h += '<div class="field"><div class="k">стоимость</div><div class="v">$' + s.cost.toFixed(6) + '</div></div>';
      }
      h += '</div></div>';
    } else if (s.type === 'step_start') {
      h += '<div class="sess-step sess-start">';
      h += '<div class="sess-header">';
      h += '<span class="sess-tag step-start">\u25b8 new</span>';
      h += '<span class="sess-title step-start">новый шаг</span>';
      h += '</div></div>';
    }
  }
  return h;
}

async function loadSessionLog(id) {
  const container = document.getElementById('session-log');
  if (!container) return;
  try {
    const r = await fetch(API + '/api/jobs/' + id + '/session-log');
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    const data = await r.json();
    container.innerHTML = renderSessionLog(data.steps);
  } catch (e) {
    container.innerHTML = '<div class="sess-error">ошибка загрузки лога сессии: ' + esc(e.message) + '</div>';
  }
}

function fmtDuration(from, to) {
  if (!from || !to) return '---';
  const d = new Date(to) - new Date(from);
  if (isNaN(d) || d < 0) return '---';
  const s = Math.floor(d / 1000);
  if (s < 60) return s + 'с';
  if (s < 3600) return Math.floor(s / 60) + 'м ' + (s % 60) + 'с';
  return Math.floor(s / 3600) + 'ч ' + Math.floor((s % 3600) / 60) + 'м';
}

// ===================================================================== STATS

async function loadStats() {
  const s = await get('/api/stats');
  if (activeTab !== 'stats') return; // пока грузилось, ушли на другую вкладку — не затираем её
  const a = s.all;

  let h = '<div class="stats-grid">';
  h += statCard('Задач', a.total);
  h += statCard('Успешно', pct(a.completed, a.total));
  h += statCard('Токенов', fmtNum(a.tokens.total));
  h += statCard('Стоимость', '$' + (a.cost || 0).toFixed(4));
  h += '</div>';

  // by agent
  h += '<div class="card"><h3>По агентам</h3><table><thead><tr><th>Агент</th><th>Задач</th><th>Успех</th><th>Токенов</th><th>Стоимость</th></tr></thead><tbody>';
  for (const [cap, d] of Object.entries(s.byAgent || {})) {
    h += '<tr><td>' + esc(cap) + '</td><td>' + d.total + '</td><td>' + pct(d.completed, d.total) + '</td><td>' + fmtNum(d.tokens.total) + '</td><td>' + fmtCost({cost:d.cost}) + '</td></tr>';
  }
  h += '</tbody></table></div>';

  // by model
  h += '<div class="card"><h3>По моделям</h3><table><thead><tr><th>Модель</th><th>Задач</th><th>Успех</th><th>Токенов</th><th>Стоимость</th></tr></thead><tbody>';
  for (const [m, d] of Object.entries(s.byModel || {})) {
    h += '<tr><td>' + esc(m) + '</td><td>' + d.total + '</td><td>' + pct(d.completed, d.total) + '</td><td>' + fmtNum(d.tokens.total) + '</td><td>' + fmtCost({cost:d.cost}) + '</td></tr>';
  }
  h += '</tbody></table></div>';

  // daily sparklines
  const days = Object.entries(s.byDay || {}).sort();
  if (days.length > 1) {
    const maxT = Math.max(...days.map(([_,d]) => d.tokens.total));
    h += '<div class="card"><h3>Токены по дням</h3>';
    h += '<div class="chart">';
    for (const [day, d] of days) {
      const pct = maxT > 0 ? (d.tokens.total / maxT * 100) : 0;
      h += '<div style="height:' + Math.max(pct, 2) + '%" title="' + day + ': ' + fmtNum(d.tokens.total) + ' токенов"></div>';
    }
    h += '</div>';
    h += '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)">';
    h += '<span>' + days[0][0] + '</span><span>' + days[days.length-1][0] + '</span>';
    h += '</div></div>';
  }

  $('#main').innerHTML = h;
}

async function editAgent(name) {
  window._editingAgent = name;
  // всегда свежий запрос, без кэша браузера — защита от устаревших данных
  const a = await get('/api/agents/' + name, { nocache: true });
  window._agentMtime = a._mtime; // для защиты от stale-записи при save
  $('#agent-editor').style.display = 'block';
  $('#ae-name').textContent = name;
  // update export button
  const expBtn = $('#ae-export');
  if (expBtn) expBtn.setAttribute('onclick', 'exportAgent(\'' + name + '\')');
  // runner — определяет, какой каталог моделей показывать
  const runnerSel = $('#ae-runner');
  if (runnerSel) runnerSel.value = a.runner || '';
  if (!a.runner || a.runner === 'opencode') {
    await refreshModels();
  } else {
    const rn = (window._runners || []).find(r => r.name === a.runner);
    populateModelSelect((rn && rn.models || []).map(id => ({ id, label: id })), 'defaults');
  }
  // model: select or custom
  const sel = $('#ae-model');
  const customInput = $('#ae-model-custom');
  if (a.model && sel && ![...sel.options].some(o => o.value === a.model)) {
    // model not in list — add it
    const opt = document.createElement('option');
    opt.value = a.model; opt.textContent = a.model;
    sel.insertBefore(opt, sel.options[sel.options.length - 1]); // before 'другая'
  }
  if (sel) sel.value = a.model || (sel.options[0] ? sel.options[0].value : '');
  onModelSelect();
  $('#ae-variant').value = a.variant || '';
  $('#ae-mode').value = a.mode || 'primary';
  $('#ae-temp').value = a.temperature != null ? a.temperature : '';
  $('#ae-worktree').value = a.worktree ? '1' : '0';
  $('#ae-autocommit').value = a.autoCommit ? '1' : '0';
  $('#ae-maxsteps').value = a.maxSteps || '';
  $('#ae-timeout').value = a.timeout || '1800';
  $('#ae-desc').value = a.description || '';
  $('#ae-prompt').value = a.systemPrompt || '';
  $('#ae-perms').value = a.permissions ? Object.entries(a.permissions).filter(([_,v]) => v === 'allow').map(([k]) => k).join(',') : 'bash,read,edit,glob,grep';

  // Загружаем MCP-серверы и расставляем чекбоксы
  loadMcpCheckboxes(a.mcp || []);

  $('#agent-editor').scrollIntoView({ behavior: 'smooth' });
}

async function createAgent() {
  const name = $('#new-agent-name').value.trim();
  if (!name) return toast('Введи имя', 'err');
  const r = await post('/api/agents/' + name, {
    name, model: 'opencode/deepseek-v4-flash-free', variant: 'medium',
    mode: 'primary', worktree: false, timeout: 1800, autoCommit: false,
    permissions: { bash: 'allow', read: 'allow', edit: 'allow', glob: 'allow', grep: 'allow' },
    systemPrompt: '', description: '',
  });
  if (r.ok) { loadSettings(); toast('создан: ' + name); }
  else toast(r.error, 'err');
}

async function saveAgent() {
  const name = $('#ae-name').textContent;
  const agent = {
    name,
    runner: $('#ae-runner').value || '',
    model: $('#ae-model').value === '__custom__' ? ($('#ae-model-custom').value || '') : $('#ae-model').value,
    variant: $('#ae-variant').value || null,
    mode: $('#ae-mode').value,
    worktree: $('#ae-worktree').value === '1',
    autoCommit: $('#ae-autocommit').value === '1',
    temperature: $('#ae-temp').value ? parseFloat($('#ae-temp').value) : undefined,
    maxSteps: $('#ae-maxsteps').value ? parseInt($('#ae-maxsteps').value) : undefined,
    timeout: parseInt($('#ae-timeout').value) || 1800,
    description: $('#ae-desc').value,
    systemPrompt: $('#ae-prompt').value,
    permissions: {},
    // защита от stale-записи: сервер проверит, что файл не менялся с момента
    // открытия формы, и вернёт 409 если менялся
    _loadedAt: window._agentMtime,
  };
  const perms = $('#ae-perms').value.split(',').map(s => s.trim()).filter(Boolean);
  for (const p of ['bash','read','edit','glob','grep','webfetch','websearch','task','skill','lsp']) {
    agent.permissions[p] = perms.includes(p) ? 'allow' : 'deny';
  }

  // Собираем выбранные MCP-серверы
  const mcpChecked = getMcpChecked();
  if (mcpChecked.length > 0) agent.mcp = mcpChecked;

  const r = await post('/api/agents/' + name, agent);
  if (r.ok) { toast('сохранено: ' + name); loadSettings(); return; }

  // 409 Conflict — файл изменился с момента открытия формы
  if (r.error && r.error.indexOf('изменился с момента открытия') >= 0) {
    toast('⚠ Конфликт: файл изменился с момента открытия. Обновляю форму...', 'err');
    // перезагружаем актуальные данные с сервера, форму не закрываем —
    // пользователь увидит свежие значения и сможет сохранить снова
    try { await editAgent(name); } catch(e) { toast('Не удалось обновить: ' + e.message, 'err'); }
    return;
  }

  toast(r.error, 'err');
}

async function deleteAgent() {
  const name = $('#ae-name').textContent;
  if (!confirm('Удалить агента ' + name + '?')) return;
  const r = await fetch(API + '/api/agents/' + name, { method: 'DELETE' });
  const j = await r.json();
  if (j.ok) { $('#agent-editor').style.display = 'none'; loadSettings(); toast('удалён: ' + name); }
  else toast(j.error, 'err');
}

async function runCleanup() {
  if (!confirm('Запустить очистку? Будут удалены задачи старше 7 дней и worktree-ветки без задач.')) return;
  const out = $('#cleanup-output');
  out.style.display = 'block';
  out.textContent = 'Выполняется...';
  try {
    const r = await post('/api/cleanup', {});
    out.textContent = r.ok ? r.output : ('Ошибка: ' + r.error);
  } catch(e) {
    out.textContent = 'Ошибка: ' + e.message;
  }
}

window._runners = null;

async function loadRunners() {

    window._runners = r.runners;
    sel.innerHTML = '';

      const opt = document.createElement('option');
      opt.value = rn.name;

// Раннер opencode — шлюз ко многим моделям, тянем список динамически через
// /api/models. Остальные раннеры — конкретный CLI с курируемым каталогом
// (см. RUNNER_MODELS на бэкенде), список статичный и приходит вместе с /api/runners.
function onRunnerSelect() {
  const runnerName = $('#ae-runner').value;
  if (!runnerName || runnerName === 'opencode') {
    refreshModels();
    return;
  }
  const rn = (window._runners || []).find(r => r.name === runnerName);
  populateModelSelect((rn && rn.models || []).map(id => ({ id, label: id })), 'defaults');
}

function populateModelSelect(models, source) {
  const sel = $('#ae-model');
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '';
  for (const m of models) {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.label || m.id;
    sel.appendChild(opt);
  }
  const custom = document.createElement('option');
  custom.value = '__custom__';
  custom.textContent = '▸ другая модель...';
  sel.appendChild(custom);

  if (cur && cur !== '__custom__') sel.value = cur;
  onModelSelect();
}

async function refreshModels() {
  try {
    const r = await get('/api/models');
    // группировка по провайдеру
    const groups = {};
    for (const m of r.models) {
      if (!groups[m.provider]) groups[m.provider] = [];
      groups[m.provider].push(m);
    }
    const sel = $('#ae-model');
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = '';
    for (const [prov, models] of Object.entries(groups).sort()) {
      const og = document.createElement('optgroup');
      og.label = prov;
      for (const m of models) {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.label || m.id;
        og.appendChild(opt);
      }
      sel.appendChild(og);
    }
    const og = document.createElement('optgroup');
    og.label = '──';
    const custom = document.createElement('option');
    custom.value = '__custom__';
    custom.textContent = '▸ другая модель...';
    og.appendChild(custom);
    sel.appendChild(og);

    if (cur && cur !== '__custom__') sel.value = cur;
    onModelSelect();
    toast('моделей: ' + r.models.length + ' (' + r.source + ')');
  } catch(e) { toast('ошибка загрузки моделей', 'err'); }
}

function onModelSelect() {
  const sel = $('#ae-model');
  const customInput = $('#ae-model-custom');
  if (sel && sel.value === '__custom__') {
    customInput.style.display = 'block';
    customInput.focus();
  } else {
    customInput.style.display = 'none';
  }
}

// ===================================================================== MCP SERVERS

async function loadMcpCheckboxes(selectedMcp) {
  const container = $('#mcp-checkboxes');
  if (!container) return;
  try {
    const servers = await get('/api/mcp-servers');
    const selSet = new Set(selectedMcp || []);

    if (servers.length === 0) {
      // Если у агента есть mcp, но серверов в конфиге нет — показываем их как stale
      if (selSet.size > 0) {
        let h = '<div class="mcp-list">';
        for (const name of selSet) {
          h += '<span class="mcp-item checked mcp-stale" data-mcp="' + esc(name) + '" style="border-style:dashed;cursor:pointer" onclick="toggleStaleMcp(this)">' +
            '<span class="mcp-checked-icon">✓</span> ' +
            '<span class="mcp-name">' + esc(name) + '</span> ' +
            '<span class="mcp-stale-tag">устаревший</span>' +
            '</span>';
        }
        h += '</div>';
        container.innerHTML = h;
      } else {
        container.innerHTML = '<span style="color:var(--muted)">нет доступных серверов</span>';
      }
      return;
    }

    // Набор имён серверов из ответа API
    const apiNames = new Set(servers.map(function(s) { return s.name; }));

    let h = '<div class="mcp-list">';
    // Сначала рендерим серверы из API
    for (const srv of servers) {
      const checked = selSet.has(srv.name) ? ' checked' : '';
      const disabledTag = srv.enabled ? '' : ' <span class="mcp-disabled-tag">откл.глобально</span>';
      h += '<label class="mcp-item' + checked + '" data-mcp="' + esc(srv.name) + '">' +
        '<input type="checkbox" value="' + esc(srv.name) + '"' + (checked ? ' checked' : '') + ' onchange="toggleMcpItem(this)">' +
        '<span class="mcp-checked-icon">✓</span> ' +
        '<span class="mcp-name">' + esc(srv.name) + '</span>' +
        disabledTag +
        '</label>';
    }
    // Затем показываем stale: серверы из mcp агента, которых нет в API
    for (const name of selSet) {
      if (!apiNames.has(name)) {
        h += '<span class="mcp-item checked mcp-stale" data-mcp="' + esc(name) + '" style="border-style:dashed;cursor:pointer" onclick="toggleStaleMcp(this)">' +
          '<span class="mcp-checked-icon">✓</span> ' +
          '<span class="mcp-name">' + esc(name) + '</span> ' +
          '<span class="mcp-stale-tag">устаревший</span>' +
          '</span>';
      }
    }
    h += '</div>';
    container.innerHTML = h;
  } catch(e) {
    container.innerHTML = '<span style="color:var(--red)">ошибка загрузки серверов: ' + esc(e.message) + '</span>';
  }
}

function toggleMcpItem(cb) {
  const label = cb.parentNode;
  if (cb.checked) {
    label.classList.add('checked');
  } else {
    label.classList.remove('checked');
  }
}

function toggleStaleMcp(el) {
  el.classList.toggle('checked');
}

function getMcpChecked() {
  const items = document.querySelectorAll('#mcp-checkboxes .mcp-item');
  const checked = [];
  for (const item of items) {
    const cb = item.querySelector('input[type=checkbox]');
    if (cb && cb.checked) {
      checked.push(item.getAttribute('data-mcp'));
    } else if (!cb) {
      // Stale items (no checkbox) — treat as checked (they have the className)
      if (item.classList.contains('checked')) {
        checked.push(item.getAttribute('data-mcp'));
      }
    }
  }
  return checked;
}

const routes = {
  jobs: showJobs,
  stats: loadStats,

let tabTimer = null;

async function switchTab(name) {
  activeTab = name;
  clearInterval(tabTimer);
  tabTimer = null;
  $$('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  // старое содержимое убираем сразу: иначе на миг видна чужая вкладка
  $('#main').innerHTML = name === 'jobs' ? '' : '<div class="empty">Загрузка…</div>';
  try {
    await routes[name]();
  } catch (e) {
    if (activeTab === name) {
      $('#main').innerHTML = '<div class="empty err">Не удалось загрузить: ' + esc(e.message) +
        '<br><button onclick="switchTab(\'' + name + '\')">Повторить</button></div>';
    }
    return;
  }
  // Статистика только читает — её можно обновлять сама. «Агенты» — нельзя: там
  // формы, а перерисовка стирает несохранённые правки (раньше — каждые 5 с).
  if (name === 'stats') {
    tabTimer = setInterval(() => { if (!document.hidden) loadStats().catch(() => {}); }, 15000);
  }
}

$$('nav button').forEach(b => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});

$('#overlay').addEventListener('click', closeDetail);

// ===================================================================== TOOLTIP

function tip(text) {
  return '<span class="tip">ⓘ<span class="tt">' + text + '</span></span>';
}

// ===================================================================== TOAST

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ===================================================================== MODAL

function showModal(html) {
  $('#modal-body').innerHTML = html;
  $('#modal').classList.add('open');
}
function closeModal() {
  $('#modal').classList.remove('open');
}
$('#modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ===================================================================== KEYBOARD

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeDetail(); closeModal(); }
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); const s = $('#ae-name'); if (s && s.textContent) saveAgent(); }
});

// ===================================================================== TEST RUN

async function testRun(name) {
  showModal('<h3>▶ Test Run: ' + esc(name) + '</h3>' +
    '<label>Промпт ' + tip('Короткий тестовый запрос. Например: прочитай README.md и напиши краткое резюме. Или: создай файл test.txt с текстом ok.') + '</label><textarea id="tr-prompt" rows="3" style="width:100%">echo "hello from ' + esc(name) + '"</textarea>' +
    '<label>Repo ' + tip('В каком репозитории работать. . = текущая директория. Или полный путь: /d/work/project') + '</label><input type="text" id="tr-repo" value=".">' +
    '<div style="margin-top:8px;display:flex;gap:8px">' +
    '<button class="primary" onclick="doTestRun(\'' + name + '\')">Запустить</button>' +
    '<button onclick="closeModal()">Отмена</button></div>' +
    '<pre id="tr-output" style="margin-top:8px;display:none;max-height:300px;overflow:auto;font-size:11px"></pre>');
}

async function doTestRun(name) {
  const prompt = $('#tr-prompt').value;
  const repo = $('#tr-repo').value || '.';
  const out = $('#tr-output');
  out.style.display = 'block';
  out.textContent = 'Выполняется...';
  try {
    const r = await fetch(API + '/api/agents/' + name + '/test-run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, repo }),
    });
    const j = await r.json();
    out.textContent = j.output || j.error || 'empty';
    if (j.ok) toast('Test run completed');
    else toast('Test run failed: ' + (j.error || 'unknown'), 'err');
  } catch(e) {
    out.textContent = 'Error: ' + e.message;
    toast('Test run error: ' + e.message, 'err');
  }
}

// ===================================================================== EXPORT

function exportAgent(name) {
  window.open(API + '/api/agents/' + name + '/export', '_blank');
}

// init
switchTab('jobs');
// живое время у работающих задач: между событиями сокета таблица иначе не меняется
setInterval(() => {
  if (activeTab === 'jobs' && !document.hidden && jobsCache.some(j => j.status === 'running')) renderJobs();
}, 15000);
</script>
